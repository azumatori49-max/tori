name: Deploy Web

# らくらく店舗メンテナンス（tsundokudo/）の Web 版を公開する。
#
# 公開先（両方にデプロイ）:
#   1. GitHub Pages: https://azumatori49-max.github.io/tori/
#   2. Cloudflare Pages: https://<project>.pages.dev （Secrets 設定時のみ）
#
# Cloudflare Pages を使う場合はリポジトリの Secrets に以下を設定する:
#   Settings → Secrets and variables → Actions → 「Secrets」タブ
#   CLOUDFLARE_API_TOKEN  … Cloudflare Pages 編集権限のAPIトークン
#   CLOUDFLARE_ACCOUNT_ID … CloudflareのアカウントID

on:
  push:
    branches:
      - claude/spreadsheet-hygiene-app-r0qya3
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は1つにまとめる（古いデプロイはキャンセル）
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Cloudflare Pages のプロジェクト名（URLの先頭部分になる）
  CF_PAGES_PROJECT: rakuraku-maintenance

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tsundokudo
    env:
      # Secrets を優先し、無ければ Variables から読む（どちらに登録してもOK）
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tsundokudo/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 1) GitHub Pages 向け（/tori 配下） ──────────────────
      - name: Export web build (GitHub Pages)
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export --platform web --clear

      - name: SPA fallback (deep-link / reload 対応)
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tsundokudo/dist

      # ── 2) Cloudflare Pages 向け（ルート配信。Secrets 設定時のみ） ──
      - name: Export web build (Cloudflare Pages)
        if: ${{ env.CF_API_TOKEN != '' }}
        env:
          WEB_BASE_URL: ''
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        # 404.html を置かないことで Cloudflare Pages の SPAフォールバックが有効になる
        run: |
          rm -rf dist-cf
          npx expo export --platform web --clear --output-dir dist-cf

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          # プロジェクトが無ければ作成（既存ならエラーを無視）
          npx wrangler@4 pages project create "$CF_PAGES_PROJECT" --production-branch=main 2>/dev/null || true
          npx wrangler@4 pages deploy dist-cf --project-name="$CF_PAGES_PROJECT" --branch=main

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
