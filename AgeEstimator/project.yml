name: AgeEstimator
options:
  bundleIdPrefix: com.tori
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO

targets:
  AgeEstimator:
    type: application
    platform: iOS
    sources:
      - path: AgeEstimator
    resources:
      - path: Models
        optional: true
        buildPhase: resources
    info:
      path: AgeEstimator/Resources/Info.plist
      properties:
        CFBundleDisplayName: 年齢推定
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        NSCameraUsageDescription: "顔を撮影して年齢を推定します。画像はデバイス内で処理され、外部に送信されません。"
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
          - front-facing-camera
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.tori.ageestimator
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
