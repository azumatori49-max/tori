<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="100" cy="100" r="92" />
    </clipPath>
  </defs>
  <!-- Outer red ring -->
  <circle cx="100" cy="100" r="98" fill="#d4151c" />
  <!-- Yellow inner -->
  <circle cx="100" cy="100" r="92" fill="#f5d316" />
  <g clip-path="url(#circle-clip)">
    <!-- Subtle red splash accent -->
    <path d="M40 80 Q 100 30 170 90 Q 150 130 110 120 Q 70 115 40 80 Z" fill="#d4151c" opacity="0.85" />
    <!-- Chicken silhouette top-left -->
    <g transform="translate(28,38) scale(0.42)" fill="#1a1a1a">
      <path d="M40 30 Q 50 5 75 12 Q 90 18 86 32 L 96 28 L 92 42 Q 110 50 110 70 Q 110 95 80 100 L 70 105 L 65 92 Q 40 90 38 70 Q 35 55 40 30 Z" />
      <!-- Wattle -->
      <path d="M82 32 Q 92 38 88 48" stroke="#d4151c" stroke-width="6" fill="none" />
      <circle cx="78" cy="28" r="3" fill="#fff" />
    </g>
  </g>
  <!-- Brand text: Japanese, kept simple -->
  <g font-family="'Noto Sans JP', system-ui, sans-serif" text-anchor="middle" fill="#1a1a1a" font-weight="900">
    <text x="100" y="70" font-size="22" letter-spacing="4">居酒屋</text>
    <text x="100" y="118" font-size="36" letter-spacing="2">鶏ヤロー</text>
    <text x="100" y="148" font-size="14" fill="#1a73c4" font-style="italic">それゆけ！</text>
  </g>
</svg>
