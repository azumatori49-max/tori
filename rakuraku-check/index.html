<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#189B8B">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>らくらく臨店チェック</title>
<script src="config.js"></script>
</head>
<body>
<style>
:root{
  --bg:#F7F6F2; --card:#FFFFFF; --ink:#1E232B; --sub:#5C6470; --line:#E3E1DA;
  --accent:#0E8577; --accent-ink:#FFFFFF; --accent-soft:#DFF2EF;
  --good:#1E7F4C; --good-bg:#E3F2E9; --warn:#B26A00; --warn-bg:#FBF0DC; --bad:#BE3E36; --bad-bg:#F9E7E5;
  --shadow:0 1px 3px rgba(30,35,43,.08);
}
:root[data-theme="light"]{
  --bg:#F7F6F2; --card:#FFFFFF; --ink:#1E232B; --sub:#5C6470; --line:#E3E1DA;
  --accent:#0E8577; --accent-ink:#FFFFFF; --accent-soft:#DFF2EF;
  --good:#1E7F4C; --good-bg:#E3F2E9; --warn:#B26A00; --warn-bg:#FBF0DC; --bad:#BE3E36; --bad-bg:#F9E7E5;
  --shadow:0 1px 3px rgba(30,35,43,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",YuGothic,Meiryo,system-ui,sans-serif;
  color:var(--ink); line-height:1.6; -webkit-font-smoothing:antialiased;
}
#app{max-width:640px;margin:0 auto;padding-bottom:96px}
/* タブレットはスマホと同じ1カラム幅で表示する */
@media (min-width:700px) and (max-width:999px){
  #app{max-width:430px}
  .navbar .in{max-width:430px}
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{
  font:inherit;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;
}
textarea{min-height:72px;resize:vertical}
input[type=number]{font-variant-numeric:tabular-nums}
.field{margin-top:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.04em;margin-bottom:4px}
.field .unit{font-size:12px;color:var(--sub);margin-left:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hd{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:12px 16px 0;
}
.hd .bar{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.hd h1{font-size:16px;font-weight:700}
.hd .meta{font-size:12px;color:var(--sub)}
.item-alert{margin-top:10px;background:var(--bad-bg);color:var(--bad);font-size:12px;font-weight:700;border-radius:8px;padding:8px 10px}
.sync-bar{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  font-size:12px;color:var(--sub);background:var(--card);
  border-bottom:1px solid var(--line);padding:7px 16px;
}
.sync-bar b{color:var(--ink);font-variant-numeric:tabular-nums}
.sync-bar .sep{color:var(--line)}
.sync-bar .save-btn{margin-left:auto}
.net-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.net-dot.on{background:var(--good)}
.net-dot.off{background:var(--bad)}
.save-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.save-state{font-size:11px;color:var(--sub)}
.save-btn{font-size:12px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:4px 14px;background:var(--card);white-space:nowrap}
#toast{
  position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;
  font-size:13px;max-width:90vw;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;
}
#toast.show{opacity:1}
.progress{height:4px;background:var(--line);border-radius:2px;margin:10px 0 0;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.cats{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat-chip{
  flex:0 0 auto;font-size:12px;font-weight:600;padding:7px 12px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);color:var(--sub);white-space:nowrap;
}
.cat-chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cat-chip .st{margin-left:4px}
.wrap{padding:16px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);padding:16px;margin-bottom:14px;position:relative;overflow:hidden;
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.card.done::before{background:var(--good)}
.card h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge.done{background:var(--good-bg);color:var(--good)}
.badge.issue{background:var(--bad-bg);color:var(--bad)}
.badge.todo{background:var(--accent-soft);color:var(--accent)}
.desc{font-size:12px;color:var(--sub);margin-top:6px}
.desc li{margin-left:1.2em}
.note{font-size:11px;color:var(--sub);margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.sec-label{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.06em;margin:14px 0 6px}
/* 推移の一覧表示（一画面でまとめて見る） */
.back-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer;flex:0 0 auto}
.trow{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:1px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:none}
.trow.alert .tname{color:var(--bad);font-weight:700}
.tname{font-size:11.5px;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsc{display:flex;align-items:center;gap:3px;flex:0 0 auto}
.tsc.empty-sc{color:var(--sub);font-size:11px}
.tbars{display:inline-flex;align-items:flex-end;gap:1.5px;height:20px}
.tbars .b{width:6px;border-radius:1.5px 1.5px 0 0;background:var(--line);min-height:2px;opacity:.5}
.tbars .b.lv5,.tbars .b.lv4{background:var(--good)}
.tbars .b.lv3{background:#D9A21B}
.tbars .b.lv2,.tbars .b.lv1{background:var(--bad)}
.tbars .b.cur{opacity:1;width:8px}
.cur-num{font-size:12px;min-width:14px;text-align:center}
.cur-num.nlv5,.cur-num.nlv4{color:var(--good)}
.cur-num.nlv3{color:#8A6D1D}
.cur-num.nlv2,.cur-num.nlv1{color:var(--bad)}
.tcat{font-size:10.5px;font-weight:700;color:var(--sub);letter-spacing:.05em;margin:5px 0 1px}
.rank-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 6px}
.back-btn:disabled{opacity:.35;cursor:default}
/* PCダッシュボード（KPIタイル）。1000px未満では表示しない */
.dash{display:none}
@media (min-width:1000px){
  .dash{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;max-width:1096px;margin:18px auto 0;padding:0 16px}
  .tile{
    text-align:left;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.7);
    border-radius:18px;padding:14px 16px;
    box-shadow:0 8px 32px rgba(31,45,61,.08);
    -webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
  }
  .tile .tl{font-size:11.5px;font-weight:700;color:var(--sub);letter-spacing:.03em}
  .tile .tv{font-size:30px;font-weight:650;line-height:1.25;margin-top:2px;color:var(--ink)}
  .tile .tv small{font-size:13px;font-weight:600;color:var(--sub);margin-left:2px}
  .tile .tv.small-v{font-size:16px;font-weight:700;margin-top:8px}
  .tile .td{font-size:12px;font-weight:700;margin-top:2px;color:var(--sub)}
  .tile .td.up{color:var(--good)}
  .tile .td.down{color:var(--bad)}
  .tile .ts{font-size:12px;color:var(--sub);margin-top:2px}
  .tile-link{cursor:pointer}
  .tile-link:hover{box-shadow:0 10px 36px rgba(31,45,61,.16)}
}
/* AIアシスタント */
.ai-hbtn{
  flex:0 0 auto;border:none;border-radius:999px;padding:7px 14px;
  font-size:12.5px;font-weight:800;letter-spacing:.04em;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),#12b8a2);
  box-shadow:0 4px 14px rgba(24,155,139,.35);
}
.ai-hbtn:active{transform:scale(.96)}
/* 経営指標（KPI・売上・FL） */
.mx-card h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mx-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.mx-t{border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:rgba(255,255,255,.5);min-width:0}
.mx-l{font-size:11px;color:var(--sub);font-weight:700}
.mx-v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3;overflow-wrap:anywhere}
.mx-v small{font-size:11.5px;font-weight:700;margin-left:2px;color:var(--sub)}
.mx-s{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.55;font-variant-numeric:tabular-nums}
.mx-note{font-size:11.5px;color:var(--sub);margin-top:10px;line-height:1.6}
.mxrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.mxrow:empty{display:none}
.mx-chip{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--accent-soft);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.mx-list{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.mx-list .mx-i{font-size:12.5px;line-height:1.55;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:rgba(255,255,255,.5);overflow-wrap:anywhere}
@media (min-width:1000px){.mx-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* MCP連携（外部AIへジャンプ） */
.mcp-hbtn{
  flex:0 0 auto;border:none;border-radius:999px;padding:7px 14px;
  font-size:12.5px;font-weight:800;letter-spacing:.04em;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,#5B6CFF,#9B59FF);
  box-shadow:0 4px 14px rgba(91,108,255,.35);
}
.mcp-hbtn:active{transform:scale(.96)}
.mcp-sheet{position:fixed;inset:0;z-index:100;background:rgba(10,12,14,.55);display:flex;align-items:flex-end;justify-content:center}
.mcp-sheet .in{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25);max-height:86vh;overflow-y:auto;position:relative}
@media (min-width:700px){.mcp-sheet{align-items:center;padding:18px}.mcp-sheet .in{border-radius:22px}}
.mcp-sheet .mcp-x{position:absolute;top:10px;right:12px;font-size:26px;line-height:1;padding:6px 10px;color:var(--sub)}
.mcp-links{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.mcp-links a{display:flex;align-items:center;gap:12px;text-decoration:none;border:1px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--ink);background:var(--bg)}
.mcp-links a:active{transform:scale(.985)}
.mcp-links .ic{font-size:22px;flex:0 0 auto}
.mcp-links b{font-size:14.5px}
.mcp-links small{display:block;font-weight:500;color:var(--sub);font-size:11.5px;margin-top:1px}
.chat-log{max-height:52vh;min-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.msg{max-width:86%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.6}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
/* 写真の拡大表示 */
.ph img{cursor:zoom-in}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(10,12,14,.88);display:flex;align-items:center;justify-content:center;padding:18px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.lightbox .lb-close{position:absolute;top:10px;right:12px;color:#fff;font-size:30px;line-height:1;padding:8px 12px;opacity:.9}
/* 更新バナー */
.upd-bar{position:fixed;left:0;right:0;top:0;z-index:80;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--accent);color:#fff;padding:11px 14px;font-size:13.5px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.upd-bar .upd-go{border:none;border-radius:8px;background:#fff;color:var(--accent);font-weight:800;font-size:13px;padding:7px 16px;cursor:pointer}
.upd-bar .upd-x{border:none;background:transparent;color:#fff;font-size:16px;padding:4px 8px;cursor:pointer;opacity:.85}
.tt{font-size:10px}
.tt{font-size:11px;color:var(--sub);margin-left:2px}
.tt.good{color:var(--good);font-weight:700}
.tt.bad{color:var(--bad);font-weight:700}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.photos .ph{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photos .ph .del{
  position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:20px;text-align:center;
}
.photo-add{
  width:72px;height:72px;border:1.5px dashed var(--accent);border-radius:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--accent);font-size:11px;font-weight:700;gap:2px;cursor:pointer;background:var(--accent-soft);
}
.photo-add span:first-child{font-size:20px;line-height:1}
.req{color:var(--bad);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{
  font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);
}
.chip.on-good{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.chip.on-warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.chip.on-bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.scale{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.scale button{
  text-align:left;width:100%;border:1.5px solid var(--line);border-radius:10px;
  padding:10px 12px;background:var(--card);font-size:13px;line-height:1.5;
}
.scale .sv{font-weight:800;font-variant-numeric:tabular-nums;margin-right:8px}
.scale .st{font-weight:700}
.scale .sd{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.scale button.on-good{background:var(--good-bg);border-color:var(--good)}
.scale button.on-good .sv,.scale button.on-good .st{color:var(--good)}
.scale button.on-warn{background:var(--warn-bg);border-color:var(--warn)}
.scale button.on-warn .sv,.scale button.on-warn .st{color:var(--warn)}
.scale button.on-bad{background:var(--bad-bg);border-color:var(--bad)}
.scale button.on-bad .sv,.scale button.on-bad .st{color:var(--bad)}
.btn{
  display:block;width:100%;text-align:center;font-weight:700;font-size:15px;
  padding:14px;border-radius:10px;background:var(--accent);color:var(--accent-ink);
}
.btn.sub{background:var(--card);color:var(--accent);border:1.5px solid var(--accent)}
.btn.ghost{background:none;color:var(--sub);border:1px solid var(--line);font-size:13px;padding:10px}
.btn:disabled{opacity:.45;cursor:default}
.navbar{
  position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--bg);
  border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
.navbar .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.navbar .btn{padding:12px}
.home-hero{padding:34px 16px 10px;text-align:left}
.hero-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero-top h1{overflow-wrap:anywhere}
.hero-top svg{width:68px;height:68px;flex:0 0 auto}
.home-hero .eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--accent)}
.home-hero h1{font-size:26px;font-weight:800;letter-spacing:.02em;margin-top:4px;text-wrap:balance}
.home-hero p{font-size:13px;color:var(--sub);margin-top:6px;max-width:34em}
.hw-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.hw-chips .ac{font-size:11px;font-weight:700;color:var(--bad);background:var(--bad-bg);border-radius:999px;padding:1px 8px}
.sum-line{font-size:12px;color:var(--sub);margin:2px 0 8px}
.sum-line b{color:var(--bad)}
.mon-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:800;color:var(--sub);background:var(--accent-soft);border-radius:8px;padding:5px 10px;margin:12px 0 2px;letter-spacing:.02em}
.mon-h small{font-weight:600}
.pl-x{display:none}
.lf-on .pl-x{display:block}
.lf-hide{display:none !important}
.lf-bar{display:grid;grid-template-columns:1fr auto;gap:8px;margin:8px 0}
.lf-bar input,.lf-bar select{width:100%;min-width:0;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card,transparent);color:inherit}
details.fold{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
details.fold>summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--accent);padding:8px 0;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸ "}
details.fold[open]>summary::before{content:"▾ "}
.hw-item{border-top:1px solid var(--line);padding:10px 0;font-size:13px}
.hw-item:first-of-type{border-top:none}
.hw-meta{font-size:11px;color:var(--sub);margin-top:2px}
.hw-row{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.list-card{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left}
.list-card .sc{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
.list-card .sc small{font-size:11px;color:var(--sub);font-weight:600}
.miss{border:1px solid var(--warn);background:var(--warn-bg);border-radius:10px;padding:12px;margin-bottom:14px}
.miss .ttl{font-weight:700;color:var(--warn);font-size:13px}
.miss button{display:block;width:100%;text-align:left;font-size:13px;padding:8px 0;border-top:1px solid var(--line)}
.miss button b{color:var(--warn)}
.score-ring{
  width:104px;height:104px;border-radius:50%;margin:0 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:6px solid var(--accent);background:var(--card);
}
.score-ring b{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.score-ring span{font-size:11px;color:var(--sub)}
.rep-h{ text-align:center;padding:8px 0 4px}
.rep-h h2{font-size:20px;font-weight:800}
.rep-h .meta{font-size:12px;color:var(--sub);margin:4px 0 14px}
.rep-item{border-top:1px solid var(--line);padding:12px 0}
.rep-item .nm{font-size:14px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rep-item .ev{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.rep-item .fx{font-size:12px;margin-top:6px;color:var(--sub)}
.rep-item .fx b{color:var(--ink)}
.rep-item .photos .ph{width:56px;height:56px}
.txt-block{margin-top:10px}
.txt-block .k{font-size:12px;font-weight:700;color:var(--sub)}
.txt-block .v{font-size:13px;white-space:pre-wrap}
.empty{font-size:13px;color:var(--sub);padding:8px 0}

/* ===== Liquid Glass テーマ（Apple風のすりガラスUI） =====
   画面用のみ。印刷（@media print）はこれまで通り白ベタで出力される */
body{
  background:
    radial-gradient(1100px 620px at 88% -12%, rgba(24,155,139,.18), transparent 62%),
    radial-gradient(900px 560px at -12% 28%, rgba(96,165,250,.16), transparent 58%),
    radial-gradient(820px 620px at 62% 112%, rgba(251,191,36,.12), transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
.card{
  background:rgba(255,255,255,.6);
  border:1px solid rgba(255,255,255,.7);
  border-radius:20px;
  box-shadow:0 8px 32px rgba(31,45,61,.10), inset 0 1px 0 rgba(255,255,255,.75);
  -webkit-backdrop-filter:blur(18px) saturate(1.6);
  backdrop-filter:blur(18px) saturate(1.6);
}
.card::before{width:0}
.hd{
  background:rgba(247,246,242,.5);
  border-bottom:1px solid rgba(255,255,255,.55);
  -webkit-backdrop-filter:blur(18px) saturate(1.6);
  backdrop-filter:blur(18px) saturate(1.6);
}
.sync-bar{
  background:rgba(247,246,242,.5);
  border-bottom:1px solid rgba(255,255,255,.5);
  -webkit-backdrop-filter:blur(14px) saturate(1.5);
  backdrop-filter:blur(14px) saturate(1.5);
}
/* 下部ナビは浮いたガラスのピルに */
.navbar{background:transparent;border-top:none;padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
.navbar .in{
  background:rgba(255,255,255,.55);
  border:1px solid rgba(255,255,255,.7);
  border-radius:22px;padding:8px;
  box-shadow:0 12px 36px rgba(31,45,61,.16);
  -webkit-backdrop-filter:blur(20px) saturate(1.7);
  backdrop-filter:blur(20px) saturate(1.7);
}
.navbar .btn{border-radius:15px}
.btn{border-radius:14px;box-shadow:0 6px 18px rgba(24,155,139,.28)}

.chip{background:rgba(255,255,255,.5);border-color:rgba(255,255,255,.75)}
.back-btn{background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.75);border-radius:12px;

input,select,textarea{background:rgba(255,255,255,.6);border-color:rgba(255,255,255,.8);border-radius:12px}
.scale button{background:rgba(255,255,255,.45);border-color:rgba(255,255,255,.7);border-radius:14px}
.photo-add{background:rgba(255,255,255,.4);border-radius:14px}
.hw-row,.miss{border-radius:14px}

.msg.ai{background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.75)}
.upd-bar{background:rgba(24,155,139,.85);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.home-hero h1{letter-spacing:.01em}
/* すりガラス非対応の古いブラウザでは不透明に近づけて読みやすさを確保 */

  .card,.navbar .in{background:rgba(255,255,255,.94)}

  .btn.sub,.back-btn,.cat-chip{background:rgba(255,255,255,.9)}
}

  .photos .ph,.photo-add{width:120px;height:120px}

function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open("rakuraku-check",2);
  r.onupgradeneeded=e=>{
    const d=e.target.result;
    if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
    if(!d.objectStoreNames.contains("inspections")) d.createObjectStore("inspections",{keyPath:"id"});
    if(!d.objectStoreNames.contains("outbox")) d.createObjectStore("outbox",{keyPath:"id"});
  };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});}
function tx(store,mode,fn){return new Promise((res,rej)=>{
  const t=db.transaction(store,mode),s=t.objectStore(store),q=fn(s);
  t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error);});}
const kvGet=k=>tx("kv","readonly",s=>s.get(k));

// 依存なし・DOM/Node非依存（ブラウザへそのまま埋め込める）。データは一切含まない。
//
// 設計方針: 「誤紐づけ」より「未紐づけ」を選ぶ。曖昧なら必ず none を返し、aliases（手動対応表）で救う。
//
//   metricKey(name, brandHint?)  正規化キー（屋号語頭・末尾「店」除去済み）
//   brandOf(name, brandHint?)    屋号（鶏ヤロー|イザカラ|すし鳥商店|まる助 | ''）
//   buildIndex(rows)             rows = [{ store, branch?, brand? }]

//   fillBrands(list)             屋号が空のアプリ店名を、同じ店名で屋号が一意に決まる他レコードから補う

//   （1つの alias 表を日報用・KPI用の両方で使えるよう、値は配列で両方の表記を書ける）
//
// 照合の優先順（上から。途中で曖昧になったら none）:
//   1. alias
//   2. 正規化キーの完全一致（how:'exact'）。屋号が両方分かって食い違えば不採用。屋号不明で同名別屋号の疑い

const MX_NUM_KEYS=["sales","budget","cumulativeBudget","pace","achievement","yoy","cost","costRate","laborAmount","laborRate","costForecast","laborForecast","salesPerHour","customerSpend","customers","updatedAt"];
function sanitizeMetrics(j){
  if(!j||typeof j!=="object"||Array.isArray(j)) throw new Error("応答の形式が想定と異なります");
  const str=v=>typeof v==="string"?v:"";
  const out={fetchedAt:str(j.fetchedAt),month:/^\d{4}-\d{2}$/.test(str(j.month))?j.month:null,daily:null,kpi:null,
    errors:(Array.isArray(j.errors)?j.errors:[]).filter(e=>typeof e==="string").slice(0,10).map(e=>e.slice(0,200)),stale:[]};
  if(j.daily&&typeof j.daily==="object"&&Array.isArray(j.daily.rows)){
    const rows=[];
    for(const r of j.daily.rows){
      if(!r||typeof r!=="object"||typeof r.store!=="string"||!r.store) continue;
      const o={id:str(r.id),store:r.store,branch:str(r.branch),brand:str(r.brand),area:str(r.area),
        asOf:/^\d{1,2}\/\d{1,2}$/.test(str(r.asOf))?r.asOf:"",error:typeof r.error==="string"?r.error.slice(0,200):null};
      for(const k of MX_NUM_KEYS) o[k]=isFin(r[k])?r[k]:null;
      o.fl=isFin(o.costRate)&&isFin(o.laborRate)?o.costRate+o.laborRate:null;
      o.flForecast=isFin(o.costForecast)&&isFin(o.laborForecast)?o.costForecast+o.laborForecast:null;
      rows.push(o);
    }
    out.daily={rows,upstreamUpdatedAt:isFin(j.daily.upstreamUpdatedAt)?j.daily.upstreamUpdatedAt:null};
  }
  if(j.kpi&&typeof j.kpi==="object"&&!Array.isArray(j.kpi)){
    const k={};
    for(const m of Object.keys(j.kpi)){
      if(!/^\d{4}-\d{2}$/.test(m)||!Array.isArray(j.kpi[m])) continue;
      const rows=j.kpi[m].filter(r=>r&&typeof r==="object"&&typeof r.store==="string"&&r.store&&isFin(r.score)).map(r=>({store:r.store,score:r.score}));
      if(rows.length) k[m]=rows;
    }
    out.kpi=Object.keys(k).length?k:null;
  }
  return out;
}
// 手動で取り込んだKPIは、同じ月の自動取得分のうち「同じ店の行」だけを置き換える（人が確認した値を優先。他の店の自動取得分は残す）。
// 貼り付けた店名の書き方が自動取得側と少し違っても（屋号なし・「1号店」など）、店名の照合で同じ店として扱い、重複行を作らない
function overlayKpi(auto,manual){
  const out={...(auto||{})};
  const months=Object.keys(manual||{}).filter(ym=>(manual[ym]||[]).length);
  if(!months.length) return out;
  const names=new Map();
  for(const ym of Object.keys(out).sort().reverse()) for(const r of out[ym]||[]) if(r&&r.store&&!names.has(indexKey(r.store))) names.set(indexKey(r.store),{store:r.store});
  let ix=null;
  try{ ix=names.size?buildIndex([...names.values()]):null; }catch(e){ ix=null; }
  const canon=name=>{
    if(ix){ try{ const m=matchStore(name,"",ix,metricsAllAliases()); if(m.row) return m.row.store; }catch(e){} }
    return name;
  };
  for(const ym of months){
    const mrows=(manual[ym]||[]).filter(r=>r&&r.store&&isFin(r.score)).map(r=>({store:canon(r.store),score:r.score}));
    if(!mrows.length) continue;
    const keys=new Set(mrows.map(r=>indexKey(r.store)));
    out[ym]=[...(out[ym]||[]).filter(r=>!keys.has(indexKey(r.store))),...mrows];
  }
  return out;
}
function mkPack(m){

function packIndexes(p){
  if(!p.ix){
    const seen=new Set(), names=[];
    for(const m of Object.keys(p.kpi).sort().reverse()) for(const r of p.kpi[m]||[]){
      if(!r||!r.store) continue;

// アプリの店名（自由入力）から、日報の行とKPIの月別点数を探す。曖昧なときは紐づけない
function packLookup(p,store,brand){
  if(p.memoN!==state.inspections.length||p.memoRef!==state.inspections){p.memo.clear();p.memoN=state.inspections.length;p.memoRef=state.inspections;}
  const key=store+"|"+(brand||"");
  if(p.memo.has(key)) return p.memo.get(key);
  let out={daily:null,dailyHow:"none",kpi:{},kpiName:"",kpiHow:"none"};
  try{
    const fb=appBrandFor(store,brand), ix=packIndexes(p), al=metricsAllAliases();
    const NONE={row:null,how:"none"};
    const md=fb.amb&&!fb.brand?NONE:matchStore(store,fb.brand,ix.daily,al);
    const mk=fb.amb&&!fb.brand?NONE:matchStore(store,fb.brand,ix.kpi,al);
    const kpi={};
    if(mk.row){
      const kk=indexKey(mk.row.store);
      for(const m of Object.keys(p.kpi)){
        const hit=(p.kpi[m]||[]).find(r=>r&&isFin(r.score)&&indexKey(r.store)===kk);
        if(hit) kpi[m]=hit.score;

    out={daily:md.row||null,dailyHow:md.how,kpi,kpiName:mk.row?mk.row.store:"",kpiHow:mk.how};

// 同業態の平均（TEAM NOTEと同じ算出：原価率は店舗の単純平均、人件費率は売上で加重）。
// 開店直後の仕入れ・準備人件費などで率が0〜100%の範囲外になった店は、平均をゆがめるので除く。FLは各店のFL率の単純平均
function metricsBrandAvg(p,brand){
  const rows=p.rows.filter(r=>r.brand===brand);
  const okRate=v=>isFin(v)&&v>=0&&v<=1;
  const cr=rows.filter(r=>okRate(r.costRate));
  const lr=rows.filter(r=>okRate(r.laborRate)&&isFin(r.laborAmount)&&isFin(r.sales)&&r.sales>0);
  const both=rows.filter(r=>okRate(r.costRate)&&okRate(r.laborRate));
  const ac=rows.filter(r=>isFin(r.achievement)&&r.achievement>=0&&r.achievement<=3);
  const mean=(a,f)=>a.length?a.reduce((s,r)=>s+f(r),0)/a.length:null;
  const lab=lr.reduce((s,r)=>s+r.laborAmount,0), sal=lr.reduce((s,r)=>s+r.sales,0);
  return {n:rows.length,nCost:cr.length,nLabor:lr.length,nFl:both.length,
    costRate:mean(cr,r=>r.costRate),laborRate:sal>0?lab/sal:null,fl:mean(both,r=>r.costRate+r.laborRate),
    achievement:mean(ac,r=>r.achievement),excluded:rows.length-both.length,
    outOfRange:rows.filter(r=>(isFin(r.costRate)&&!okRate(r.costRate))||(isFin(r.laborRate)&&!okRate(r.laborRate))).length};
}
async function metricsRequest(url,key){
  const base=String(url||"").trim().replace(/\/+$/,"").replace(/\/metrics$/,"");
  if(!/^https:\/\//.test(base)) throw new Error("取得先URLは https:// で始まる形式にしてください");
  // 25秒で「本文の受信まで」含めて打ち切る（回線が途中で止まっても取得が固まったままにならないように）
  const ac=typeof AbortController!=="undefined"?new AbortController():null;
  const timer=ac?setTimeout(()=>ac.abort(),25000):null;
  try{
    return await withTimeout((async()=>{
      const r=await fetch(base+"/metrics",{headers:{Authorization:"Bearer "+String(key||"").trim()},cache:"no-store",signal:ac?ac.signal:undefined});
      if(r.status===401) throw new Error("閲覧キーが正しくありません");
      if(!r.ok) throw new Error(`取得に失敗しました (${r.status})`);
      return await r.json();
    })(),26000);
  }finally{ if(timer) clearTimeout(timer); }
}
// 取得結果を反映する。日報かKPIの片方だけ失敗した応答（Workerは部分的でも返す）は、失敗した側だけ前回の値を残す
function applyMetrics(j){
  const prev=state.metrics;
  const out={...j,stale:[]};
  if(prev){
    if(!j.daily&&prev.daily){out.daily=prev.daily; out.month=j.month||prev.month; out.stale.push("日報");}
    if(!j.kpi&&prev.kpi){out.kpi=prev.kpi; out.stale.push("KPI");}
  }
  state.metrics=out;
  metricsErr="";
  // 一部でも失敗していたら1分後に再取得、そろっていれば10分後
  metricsAt=Date.now()-(j.errors.length?METRICS_STALE_MS-60*1000:0);
  metricsClearMemo();
  kvSet("metrics",out).catch(()=>{});
  // 月ごとの記録には、今回の応答で実際に取れた側だけを渡す（前回値の流用分で、クラウド上の新しい記録を古い値に戻さない）
  cloudSaveMetricsSnapshot({month:j.month,fetchedAt:j.fetchedAt,daily:j.daily,kpi:j.kpi});
}
// 取得中にもう一度呼ばれたら、その取得の完了を待たせる（保存直後の再取得・AIの質問前の取得が空振りしないように）
function fetchMetrics(force){
  if(!metricsOn()) return Promise.resolve();
  if(metricsInflight) return metricsInflight;
  if(!force&&Date.now()-metricsAt<METRICS_STALE_MS) return Promise.resolve();
  metricsBusy=true;
  const same=(a,b)=>!!a&&!!b&&a.url===b.url&&a.key===b.key;
  metricsInflight=(async()=>{
    try{
      // 取得中に設定が変わった/消えた場合は、その応答を使わず、新しい設定で取り直す（同じ待ちの中で最大3回）
      for(let n=0;n<3&&metricsOn();n++){
        const cfg=metricsCfg;
        try{
          const j=sanitizeMetrics(await metricsRequest(cfg.url,cfg.key));
          if(!same(metricsCfg,cfg)) continue;
          applyMetrics(j);
          return;
        }catch(e){
          if(!same(metricsCfg,cfg)) continue;
          metricsErr=String(e&&e.message||e).slice(0,140);
          metricsAt=Date.now()-METRICS_STALE_MS+60*1000;   // 失敗時は1分後まで再試行しない
          return;
        }
      }
    }finally{
      metricsBusy=false; metricsInflight=null;
      refreshMetricSlots();
    }
  })();
  return metricsInflight;
}
// 月ごとの記録をクラウドに残す（過去月のCSV・AI分析用）。取得のたびではなく数時間おきに1回
async function cloudSaveMetricsSnapshot(j){
  if(!fsDb||!j||!j.month||!(j.daily&&j.daily.rows&&j.daily.rows.length)) return;
  if(Date.now()-metricsSnapAt<3*3600*1000) return;
  metricsSnapAt=Date.now();
  const doc={month:j.month,fetchedAt:j.fetchedAt||new Date().toISOString(),rows:j.daily.rows};
  if(j.kpi) doc.kpi=overlayKpi(j.kpi,metricsManualKpi);   // KPIが取れていない時は書かない（既存の記録を消さない）
  const ok=await cloudTry(()=>fsMods.setDoc(fsMods.doc(fsDb,"config","metrics-"+j.month),doc,{merge:true}));
  if(!ok) metricsSnapAt=0;
}

      if(metricsCfg&&metricsCfg.synced===false&&isoMs(d.updatedAt)<=(metricsCfg.at||0)){
        // この端末で圏外のときに保存した設定が未送信（クラウドより新しい） → 送る
        if(await cloudSaveMetricsCfg(metricsCfg,null)){metricsCfg={...metricsCfg,synced:true};kvSet("metricsCfg",metricsCfg).catch(()=>{});}
      }else if(!metricsCfg||metricsCfg.url!==d.url||metricsCfg.key!==d.key||!metricsCfg.synced){
        metricsCfg={url:d.url,key:d.key,synced:true,at:isoMs(d.updatedAt)}; kvSet("metricsCfg",metricsCfg).catch(()=>{}); changed=true;
      }
    }else if(!d&&metricsCfg){
      if(metricsCfg.synced===true){
        // 以前クラウドと同期済みだったのにクラウドから消えた＝他の端末で削除された
        metricsCfg=null; state.metrics=null; kvDel("metricsCfg").catch(()=>{}); kvDel("metrics").catch(()=>{}); changed=true;
      }else if(await cloudSaveMetricsCfg(metricsCfg,null)){
        metricsCfg={...metricsCfg,synced:true}; kvSet("metricsCfg",metricsCfg).catch(()=>{});
      }
    }
    // --- 店名の対応表 ---
    if(metricsMeta.aliasesPendingAt){
      // この端末で圏外のときに直した対応表が未送信。クラウドがそれより新しければクラウドを採用、そうでなければ送る
      if(ad&&isoMs(ad.updatedAt)>metricsMeta.aliasesPendingAt&&ad.map&&typeof ad.map==="object"){
        metricsAliases=ad.map; kvSet("metricsAliases",metricsAliases).catch(()=>{}); metricsMeta.aliasesPendingAt=0; persistMetricsMeta(); changed=true;
      }else if(await cloudSaveMetricsCfg(null,metricsAliases)){metricsMeta.aliasesPendingAt=0; persistMetricsMeta();}
    }else if(ad&&ad.map&&typeof ad.map==="object"&&!Array.isArray(ad.map)&&JSON.stringify(ad.map)!==JSON.stringify(metricsAliases)){
      metricsAliases=ad.map; kvSet("metricsAliases",ad.map).catch(()=>{}); changed=true;
    }
    if(changed) metricsClearMemo();
    if(changed||wasOn!==metricsOn()) softRender();
    if(metricsOn()){ fetchMetrics(true); loadManualKpi(metricsRecentMonths(5)); }   // 手動KPIの読み込みを待たずに取得を始める（届いたら表示を更新する）
  }catch(e){}
}
// KPIシートを自動取得できないとき用：スプレッドシートの「店名列＋点数列」を貼り付けて月ごとに取り込む
function parseKpiText(text){
  const rows=[];
  for(const raw of String(text||"").split(/\r?\n/)){
    const line=raw.normalize("NFKC").trim(); if(!line) continue;
    let name="", score="";
    if(line.includes("\t")){const c=line.split("\t").map(x=>x.trim()); name=c[0]; score=c[1];}
    else if(line.includes(",")){const c=line.split(",").map(x=>x.trim().replace(/^"|"$/g,"")); name=c[0]; score=c[1];}
    else{const m=/^(.*\S)\s+(-?\d+(?:\.\d+)?)\s*点?$/.exec(line); if(m){name=m[1];score=m[2];}}
    const v=parseFloat(String(score||"").replace(/[点\s]/g,""));
    if(!name||!Number.isFinite(v)||/^(平均|合計|全体|全社|total|average)/i.test(name)) continue;
    rows.push({store:name.replace(/\s+/g," "),score:v});
  }
  return rows;
}
function cloudSaveKpiManual(ym,rows){ return cloudTry(()=>fsMods.setDoc(fsMods.doc(fsDb,"config","kpi-"+ym),{month:ym,rows,updatedAt:new Date().toISOString()})); }
function cloudDeleteKpiManual(ym){ return cloudTry(()=>fsMods.deleteDoc(fsMods.doc(fsDb,"config","kpi-"+ym))); }
// 手動取り込み分を読み込む（月ごとに1回）。圏外で取り込んで未送信のものはクラウドへ送り、圏外で削除した分はクラウドからも消す
async function loadManualKpi(months,force){
  if(IS_COMPANY_SITE||!fsDb||!fsMods||!fsMods.getDoc) return;
  const seq=metricsEditSeq;
  let changed=false, pendingChanged=false, metaChanged=false;
  await Promise.all([...new Set(months)].filter(ym=>/^\d{4}-\d{2}$/.test(ym||"")&&(force||!metricsManualTried[ym])).map(async ym=>{
    try{
      const snap=await fsMods.getDoc(fsMods.doc(fsDb,"config","kpi-"+ym));
      if(seq!==metricsEditSeq) return;   // 読み取り中にこの端末で編集した → 古い読み取り結果で取り消さない
      metricsManualTried[ym]=true;
      const d=snap&&snap.exists&&snap.exists()?snap.data():null;
      const cloudRows=d&&Array.isArray(d.rows)&&d.rows.length?d.rows:null;
      if(metricsMeta.kpiDeleted[ym]){
        if(!cloudRows||await cloudDeleteKpiManual(ym)){delete metricsMeta.kpiDeleted[ym];metaChanged=true;}
        return;
      }
      const pend=Number(metricsManualPending[ym])||0;
      if(pend&&metricsManualKpi[ym]){
        if(cloudRows&&isoMs(d.updatedAt)>pend){ metricsManualKpi[ym]=cloudRows; delete metricsManualPending[ym]; pendingChanged=true; changed=true; }   // クラウドの方が新しい
        else if(await cloudSaveKpiManual(ym,metricsManualKpi[ym])){delete metricsManualPending[ym];pendingChanged=true;}
      }else if(cloudRows){
        if(JSON.stringify(metricsManualKpi[ym])!==JSON.stringify(cloudRows)){metricsManualKpi[ym]=cloudRows;changed=true;}
      }else if(metricsManualKpi[ym]){delete metricsManualKpi[ym];changed=true;}   // 他の端末で削除された
    }catch(e){ /* 取得できなければ次回また試す */ }
  }));
  if(pendingChanged) kvSet("kpiManualPending",metricsManualPending).catch(()=>{});
  if(metaChanged) persistMetricsMeta();
  if(changed){
    kvSet("kpiManual",metricsManualKpi).catch(()=>{});
    metricsClearMemo(); refreshMetricSlots();
    if(state.view==="admin") softRender();
  }
}

function parseAliases(text){

  return o;
}

function csvEsc(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function buildCsv(month){ // month="YYYY-MM" を渡すとその月の分だけに絞る
  const head=["日付","屋号","店舗","確認者","総合点(100点満点)","状態",
    ...ALL_ITEMS.map(i=>i.name+"(5点満点)"),
    ...INTERVIEW_QS.map(q=>"面談："+q.label.replace(/^\d+\.\s*/,"")),
    ...(metricsOn()?METRICS_CSV_HEAD:[])];
  const list=[...state.inspections].filter(i=>i.completedAt&&(!month||ymOf(i.date)===month))
    .sort((a,b)=>(a.date+(a.completedAt||"")).localeCompare(b.date+(b.completedAt||"")));
  const rows=[head];
  for(const i of list){
    const iv=(i.pdca&&i.pdca.interview)||{};
    rows.push([i.date,i.brand||"",i.store,i.inspector,i.totalScore,i.provisional?"一時保存(入力途中)":"完了",
      ...ALL_ITEMS.map(it=>{const s=score5Of(it,i);return s==null?"":s;}),
      ...INTERVIEW_QS.map(q=>String(iv[q.key]||"").trim()),
      ...(metricsOn()?metricsCsvCells(i):[])]);
  }
  return rows.map(r=>r.map(csvEsc).join(",")).join("\n");
}

/* ---------- AIアシスタント（β） ----------
   全店のチェック結果・ランキング・面談内容をGemini（既存のAI接続）に渡し、
   チャット形式で質問に答える。回答は補助情報という位置づけ。 */
let chatBusy=false;
function buildAssistantContext(){
  const lines=[];
  const cur=ymOf(todayStr());
  for(const m of [cur,ymAdd(cur,-1)]){
    const rank=storeRanking(m);
    if(rank.length) lines.push(`【${ymLabel(m)}のランキング（総合点が低い順）】`+rank.map((r,i)=>`${i+1}位 ${r.brand?r.brand+" ":""}${r.store} ${r.score}点`).join("、"));
  }
  const stores=[...new Set(state.inspections.filter(i=>i.completedAt&&!i.provisional).map(i=>i.store))];
  const al=stores.map(s=>{const a=storeAlerts(s);return a.length?`${s}：${a.map(x=>`${x.it.name}（3点以下${x.c}回）`).join("、")}`:null;}).filter(Boolean);
  if(al.length) lines.push("【アラート項目】"+al.join("／"));
  const dsMonth=ymOf(todayStr());
  const ds=dangerStores(dsMonth);
  if(ds.length) lines.push(`【面談リスクの高い店舗（${ymLabel(dsMonth)}）】`+ds.map(d=>`${d.store}（リスク${d.risk}・${d.level}${d.summary?`：${d.summary}`:""}）`).join("／"));
  const mx=metricsContextLines();
  if(mx) lines.push(mx.trimEnd());
  // チェックデータ本体（CSV・写真なし）。長すぎる場合は新しい記録を優先して収める
  let csv=buildCsv();
  const MAX=24000;
  if(csv.length>MAX){
    const rows=csv.split("\n");
    const acc=[rows[0]]; let len=rows[0].length; let cut=false;
    for(let i=rows.length-1;i>=1;i--){
      if(len+rows[i].length>MAX){cut=true;break;}
      acc.splice(1,0,rows[i]); len+=rows[i].length;
    }
    csv=acc.join("\n")+(cut?"\n（これより古い記録は省略）":"");
  }
  lines.push("【チェックデータ（CSV）】\n"+csv);
  return lines.join("\n");
}
// Claude API（ブラウザ直接呼び出し）。AIアシスタントの回答品質を上げるために使う
async function claudeAsk(prompt){
  const r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key":deviceClaudeKey,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true",
    },
    body:JSON.stringify({model:CLAUDE_MODEL,max_tokens:2048,messages:[{role:"user",content:prompt}]}),
  });
  if(!r.ok){
    let msg=""; try{ msg=((await r.json()).error||{}).message||""; }catch(e){}
    const hint=r.status===401?"（APIキーが正しくありません）":r.status===400&&/credit/i.test(msg)?"（クレジット残高が不足しています）":r.status===429?"（回数上限。少し待ってください）":"";
    throw new Error(`Claude APIエラー ${r.status}${hint}${msg?"："+msg.slice(0,120):""}`);
  }
  const j=await r.json();
  return (j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
}

async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }
  catch(e){
    try{
      const ta=document.createElement("textarea"); ta.value=txt;
      ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok=document.execCommand("copy"); ta.remove(); return ok;
    }catch(e2){ return false; }
  }
}
function downloadCsv(month){
  const blob=new Blob(["\uFEFF"+buildCsv(month)],{type:"text/csv;charset=utf-8"}); // BOM付き（Excelの文字化け防止）
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=month?`臨店チェック_${ymLabel(month)}.csv`:`臨店チェック_全店データ_${todayStr()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function monthlyAvg(hist){
  const m={};
  hist.forEach(h=>{const k=h.date.slice(0,7);(m[k]||(m[k]=[])).push(h.s5);});
  return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0]))
    .map(([k,v])=>({month:k,avg:v.reduce((a,b)=>a+b,0)/v.length}));
}
function beep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.frequency.value=880;g.gain.value=0.12;o.start();
    o.frequency.setValueAtTime(660,ctx.currentTime+0.15);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.45);
    o.stop(ctx.currentTime+0.45);
  }catch(e){}
}

function compressPhoto(file){return new Promise((res,rej)=>{
  const img=new Image(); const url=URL.createObjectURL(file);
  img.onload=()=>{
    const MAX=1000; let w=img.naturalWidth,h=img.naturalHeight;
    const sc=Math.min(1,MAX/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    cv.getContext("2d").drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg",0.72));
  };
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("画像を読み込めません"));};
  img.src=url;});}

function aiConfigured(){return !!geminiKey()||!!(state.fb&&state.fb.config&&state.fb.config.apiKey);}
function parseFirebaseConfig(text){
  text=String(text||"").trim(); if(!text) return null;
  try{const o=JSON.parse(text); if(o&&o.apiKey) return o;}catch(e){}
  // コンソールからコピーした「const firebaseConfig = { apiKey: "..." }」形式にも対応
  const o={};
  for(const m of text.matchAll(/([A-Za-z][A-Za-z0-9]*)\s*:\s*["']([^"']*)["']/g)) o[m[1]]=m[2];
  return o.apiKey?o:null;
}
async function getAIModel(name){
  const model=name||(state.fb&&state.fb.model)||DEFAULT_AI_MODEL;
  if(aiModels[model]) return aiModels[model];
  if(!aiConfigured()) throw new Error("Firebase設定が未登録です。管理画面の「写真AI自動判定の設定」から登録してください。");
  let appMod,aiMod;
  try{
    [appMod,aiMod]=await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${FB_SDK_VERSION}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${FB_SDK_VERSION}/firebase-ai.js`),
    ]);
  }catch(e){ throw new Error("Firebase SDKを読み込めませんでした。ネットワーク接続を確認してください（プレビュー環境では外部接続がブロックされる場合があります）。"); }
  const app=appMod.getApps().length?appMod.getApp():appMod.initializeApp(state.fb.config);
  if(SHARED_APPCHECK_SITE_KEY&&!getAIModel._appCheckDone){
    try{
      const acMod=await import(`https://www.gstatic.com/firebasejs/${FB_SDK_VERSION}/firebase-app-check.js`);
      acMod.initializeAppCheck(app,{provider:new acMod.ReCaptchaV3Provider(SHARED_APPCHECK_SITE_KEY),isTokenAutoRefreshEnabled:true});
      getAIModel._appCheckDone=true;
    }catch(e){ /* App Checkが読み込めない環境でもAI呼び出し自体は試みる（サーバー側で拒否される） */ }
  }
  const ai=aiMod.getAI(app,{backend:new aiMod.GoogleAIBackend()});
  aiModels[model]=aiMod.getGenerativeModel(ai,{model});
  return aiModels[model];
}
// AI Studio キーがある場合は Gemini API を直接呼ぶ（Firebase AI Logic 非経由）
async function geminiRest(model,input){
  const parts=(typeof input==="string"?[{text:input}]:input.map(p=>typeof p==="string"?{text:p}:p));
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{
    method:"POST",
    headers:{"Content-Type":"application/json","x-goog-api-key":geminiKey()},
    body:JSON.stringify({contents:[{parts}]})});
  if(!res.ok){
    const t=await res.text().catch(()=>"");
    throw new Error(`${res.status} ${t.slice(0,400)}`);
  }
  const j=await res.json();
  return (j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts||[]).map(p=>p.text||"").join("");
}
// モデル呼び出しの共通処理。無料枠の上限・モデル提供終了のときは、
// もう片方のモデル（liteとflashは無料枠が別）に自動で切り替えて再試行する。
async function aiGenerate(input){
  const tried=[];
  let model=(state.fb&&state.fb.model)||DEFAULT_AI_MODEL;
  for(let attempt=0;attempt<AI_MODEL_ROTATION.length+1;attempt++){
    try{
      let text;
      if(geminiKey()){
        await aiThrottle();
        text=await geminiRest(model,input);
      }else{
        const m=await getAIModel(model); await aiThrottle();
        const r=await m.generateContent(input); text=r.response.text();
      }
      lastAIError="";
      return text;
    }catch(err){
      const msg=String(err&&err.message||err);
      lastAIError=`[${model}] ${msg}`.slice(0,300);
      lastAIErrors[model]=msg.slice(0,500);
      tried.push(model);
      const quotaLike=/429|quota|rate.?limit|resource.?exhausted|no longer available|not found|404|limit:\s*0/i.test(msg);
      const alt=AI_MODEL_ROTATION.find(x=>!tried.includes(x));
      if(quotaLike&&alt){ model=alt; continue; }
      if(quotaLike&&!alt){
        const hints=tried.map(t=>{const h=quotaHint(lastAIErrors[t]||"");return h?`${t}：${h}`:""}).filter(Boolean).join("／");
        throw new Error(`2つのモデル（${tried.join("、")}）とも上限です。${hints||"数分〜数時間おいて再試行してください。"}`);
      }
      throw err;
    }
  }
  throw new Error("2つのモデルとも無料枠の上限に達しています。数分待つか、時間を置いて再試行してください。");
}
function buildJudgePrompt(item){
  const groups=item.groups.map(g=>`- ${g.key}（${g.label}）：${g.options.map(o=>o.v+(o.desc?`（${o.desc}）`:"")).join(" ／ ")}`).join("\n");
  return `あなたは飲食店の店舗巡回チェックの検査員です。添付の写真を確認し、次のチェック項目を判定してください。
チェック項目：${item.name}
確認内容：${item.desc.join("、")}
評価グループと選択肢：
${groups}
写真から判断できる範囲で、各評価グループについて最も適切な選択肢を1つずつ、選択肢の文言そのままで選んでください。
次のJSONのみを出力してください（コードブロックや説明文は不要）：
{"judgments":{${item.groups.map(g=>`"${g.key}":"選択肢の文言"`).join(",")}},"reason":"判定理由を60字以内","confidence":"高か中か低"}`;
}
function quotaHint(msg){
  const hints=[];
  if(/PerMinute/i.test(msg)) hints.push("1分あたりの回数上限に到達（約1分で回復）");
  if(/PerDay/i.test(msg)) hints.push("1日あたりの回数上限に到達（日本時間の夕方頃リセット)");
  const m=/limit:\s*(\d+)/i.exec(msg);
  if(m) hints.push(m[1]==="0"?"上限値=0（このモデルはこの経路では無料枠なし）":`上限値=${m[1]}回`);
  const r=/retry in ([\d.]+)s/i.exec(msg);
  if(r) hints.push(`約${Math.ceil(+r[1])}秒後に再試行可`);
  return hints.join("・");
}
function friendlyAIError(err){
  const s=String(err&&err.message||err);
  if(/no longer available|not found|404/i.test(s))
    return `このモデルは提供終了または利用できません。設定でモデルを「${DEFAULT_AI_MODEL}」に変更して保存し、再試行してください。`;
  if(/limit:\s*0/.test(s)&&/quota/i.test(s))
    return `選択中のモデルには無料枠がありません。モデルを「${DEFAULT_AI_MODEL}」に変更して保存し、再試行してください。`;
  if(/429|quota|rate.?limit/i.test(s))
    return "無料枠の利用上限に達しました。1分ほど待ってから再試行してください。";
  if(/403|permission|not.?enabled|api.?key/i.test(s))
    return "アクセスが拒否されました。Firebaseコンソールで「Firebase AI Logic」が有効か、APIキーの制限設定を確認してください。詳細："+s.slice(0,120);
  return s;
}
function parseAIJson(text){
  text=String(text||"").replace(/```(?:json)?/g,"");
  const s=text.indexOf("{"),e=text.lastIndexOf("}");
  if(s<0||e<=s) return null;
  try{return JSON.parse(text.slice(s,e+1));}catch(err){return null;}
}
// 無料枠のRPM制限（15回/分）に当たらないよう、AI呼び出しの間隔を空ける
let _lastAI=0;
async function aiThrottle(){
  const GAP=4500;
  const now=Date.now(); const wait=Math.max(0,_lastAI+GAP-now);
  _lastAI=now+wait;
  if(wait) await new Promise(r=>setTimeout(r,wait));
}
// AI送信用に写真を縮小（トークン消費の節約。保存用の写真はそのまま）
function shrinkForAI(dataUrl){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=640; let w=img.naturalWidth,h=img.naturalHeight;
      const sc=Math.min(1,MAX/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      res(c.toDataURL("image/jpeg",0.6).split(",")[1]);
    };
    img.onerror=()=>res(dataUrl.split(",")[1]);
    img.src=dataUrl;
  });
}

async function judgeBatch(targets,silent){
  const d=state.draft; if(!d||batchBusy) return;
  aiGen++;
  batchBusy=true; batchErr=""; if(!silent) render();
  try{
    const parts=["あなたは飲食店の店舗巡回チェックの検査員です。以下の各チェック項目について、直後に添付された写真を確認して判定してください。"];
    for(const it of targets){
      const a=d.answers[it.id];
      const groups=it.groups.map(g=>`- ${g.key}（${g.label}）：${g.options.map(o=>o.v+(o.desc?`（${o.desc}）`:"")).join(" ／ ")}`).join("\n");
      parts.push(`\n【項目 ${it.id}】${it.name}\n確認内容：${it.desc.join("、")}\n選択肢：\n${groups}\nこの項目の写真：`);
      for(const p of a.photos.slice(0,2)){ parts.push({inlineData:{mimeType:"image/jpeg",data:await shrinkForAI(p)}}); }
    }
    parts.push(`\n\nすべての項目について、次のJSONのみを出力してください（コードブロックや説明文は不要。選択肢は文言そのまま）：\n{"items":{${targets.map(it=>`"${it.id}":{"judgments":{${it.groups.map(g=>`"${g.key}":"選択肢の文言"`).join(",")}},"reason":"判定理由を40字以内","confidence":"高か中か低"}`).join(",")}}}`);
    const out=parseAIJson(await aiGenerate(parts));
    if(!out||!out.items) throw new Error("AIの応答を解釈できませんでした。もう一度お試しください。");
    let n=0;
    for(const it of targets){
      const r=out.items[it.id];
      if(r&&r.judgments){ d.answers[it.id].ai={suggest:r.judgments,reason:String(r.reason||""),conf:String(r.confidence||""),at:todayStr()}; n++; }
    }
    persistDraft();
    showToast(`AI判定が完了しました（${n}項目・API呼び出し1回）`);
    if(silent&&state.view==="check"){ for(const it of targets) refreshCard(it.id); }
  }catch(err){
    batchErr=friendlyAIError(err);
    if(silent) showToast("AI判定を保留しました："+batchErr.slice(0,40));
  }
  finally{ batchBusy=false; if(!silent) render(); }
}
async function judgeItem(itemId){
  if(!state.draft) return;
  const item=findItem(itemId); if(!item) return;
  const a=ans(itemId);
  if(!a.photos.length){alert("先に写真を追加してください。");return;}
  if(!aiConfigured()){alert("管理画面の「写真AI自動判定の設定」でFirebase設定を登録すると利用できます。");return;}
  if(aiBusy.has(itemId)) return;
  aiBusy.add(itemId); aiErr.delete(itemId); refreshCard(itemId);
  const gen=aiGen;
  try{
    const parts=[];
    for(const p of a.photos){ parts.push({inlineData:{mimeType:"image/jpeg",data:await shrinkForAI(p)}}); }
    const out=parseAIJson(await aiGenerate([...parts,buildJudgePrompt(item)]));
    if(!out||!out.judgments) throw new Error("AIの応答を解釈できませんでした。もう一度お試しください。");
    if(gen!==aiGen) return; // まとめて判定が後から実行された場合は、こちらの結果は破棄
    a.ai={suggest:out.judgments,reason:out.reason||"",conf:out.confidence||"",at:todayStr()};
    persistDraft();
  }catch(err){
    aiErr.set(itemId,friendlyAIError(err));
  }finally{
    aiBusy.delete(itemId); refreshCard(itemId);
  }
}
let ivBusy=false, ivErr="";
async function analyzeInterview(store,iv){
  const qs=INTERVIEW_QS.map(q=>({q,t:String(iv[q.key]||"").trim()}));
  const prompt=`あなたは飲食チェーンのスーパーバイザーを補佐するAIです。以下は店舗「${store}」の社員との面談記録です。
${qs.map(x=>`${x.q.label}
${x.t||"（未回答）"}`).join("\n")}

この面談内容を分析し、次のJSONのみを出力してください（コードブロックや説明文は不要）：
{"summary":"面談内容の要約（100字以内）","risk":0,"level":"高か中か低","concerns":["懸念点を最大4つ"],"reason":"リスク判定の理由（60字以内）"}
riskは0〜100の整数で、人間関係の悪化・人手不足・退職リスク・設備の故障放置・衛生問題・業務過多などが深刻なほど高くしてください。`;
  const out=parseAIJson(await aiGenerate(prompt));
  if(!out||out.summary==null) throw new Error("AIの応答を解釈できませんでした。もう一度お試しください。");
  return {
    summary:String(out.summary||""),
    risk:Math.max(0,Math.min(100,Math.round(+out.risk||0))),
    level:["高","中","低"].includes(out.level)?out.level:"中",
    concerns:Array.isArray(out.concerns)?out.concerns.slice(0,4).map(String):[],
    reason:String(out.reason||""),
    at:todayStr(),
  };
}

function dangerStores(month){
  const stores=[...new Set(state.inspections.filter(i=>i.completedAt).map(i=>i.store))];
  return stores.map(s=>{
    const list=completedFor(s).filter(i=>!month||ymOf(i.date)===month);
    for(let i=list.length-1;i>=0;i--){
      const ai=list[i].pdca&&list[i].pdca.interview&&list[i].pdca.interview.ai;
      if(ai) return {store:s,risk:ai.risk,level:ai.level,date:list[i].date,id:list[i].id,summary:ai.summary};
    }
    return null;
  }).filter(Boolean).filter(x=>x.level==="高"||x.level==="中")
    .sort((a,b)=>b.risk-a.risk);
}
function applyAISuggestion(itemId){
  const item=findItem(itemId); const a=ans(itemId);
  if(!a.ai||!a.ai.suggest) return;
  for(const g of item.groups){
    const v=a.ai.suggest[g.key];
    if(g.options.some(o=>o.v===v)) a.evals[g.key]=v;
  }
  persistDraft(); refreshCard(itemId);
}

const app=$("#app");
async function sha256hex(s){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
}
function viewLock(){
  return `
  <div class="home-hero" style="text-align:center;padding-top:64px">
    <div style="display:flex;justify-content:center">${LOGO_SVG.replace("<svg ","<svg style=\"width:88px;height:88px\" ")}</div>
    <h1 style="margin-top:12px">${esc(APP_NAME)}</h1>
    <p style="margin:8px auto 0">アクセスコードを入力してください。</p>
  </div>
  <div class="wrap">
    <div class="card">
      <div class="field"><label>アクセスコード</label>
        <input type="password" id="lock-code" autocomplete="off" inputmode="text" placeholder="コードを入力">
      </div>
      <div style="margin-top:12px"><button class="btn" id="lock-go">解除する</button></div>
      <p class="note" id="lock-msg">コードがわからない場合は、管理者にお問い合わせください。</p>
    </div>
  </div>`;
}
function bindLock(){
  const tryUnlock=async()=>{
    const code=$("#lock-code").value.trim();
    if(!code) return;
    try{
      const h=await sha256hex(code);
      if(h===ACCESS_CODE_HASH){
        await kvSet("access",h).catch(()=>{});
        state.locked=false; render(); return;
      }
    }catch(e){}
    const m=$("#lock-msg"); if(m){m.textContent="コードが違います。もう一度お試しください。";m.style.color="var(--bad)";}
  };
  $("#lock-go")?.addEventListener("click",tryUnlock);
  $("#lock-code")?.addEventListener("keydown",e=>{if(e.key==="Enter")tryUnlock();});
  $("#lock-code")?.focus();
}
function render(){
  let html="";
  if(state.locked){app.innerHTML=viewLock();bindLock();return;}
  if(state.view==="home") html=viewHome();
  else if(state.view==="check") html=viewCheck();
  else if(state.view==="report") html=viewReport();
  else if(state.view==="trends") html=viewTrends();
  else if(state.view==="assistant") html=viewAssistant();
  else if(state.view==="admin") html=viewAdmin();
  app.innerHTML=html;
  app.insertAdjacentHTML("afterbegin",'<div id="sync-bar" class="sync-bar"></div>');
  updateSyncBar();
  if(state.view==="home") bindHome();
  if(state.view==="admin") bindAdmin();
  if(metricsOn()){ fetchMetrics(false); refreshMetricSlots(); ensureSlotMonths(); }   // 古ければ裏で取り直し、スロットだけを埋める（画面全体は描き直さない）
}

/* PC用ダッシュボード（KPIタイル）。スマホでは表示しない */
function dashboardHtml(){
  const done=state.inspections.filter(i=>i.completedAt&&!i.provisional);
  if(!done.length) return "";
  const cur=ymOf(todayStr()), prev=ymAdd(cur,-1);
  const curChecks=done.filter(i=>ymOf(i.date)===cur);
  const prevChecks=done.filter(i=>ymOf(i.date)===prev);
  const avg=a=>a.length?Math.round(a.reduce((s,i)=>s+(i.totalScore||0),0)/a.length):null;
  const curAvg=avg(curChecks), prevAvg=avg(prevChecks);
  const scoreDelta=(curAvg!=null&&prevAvg!=null)?curAvg-prevAvg:null;
  const checkDelta=prevChecks.length?curChecks.length-prevChecks.length:null;
  const worst=storeRanking(cur)[0]||null;
  const stores=[...new Set(done.map(i=>i.store))];
  const alertCount=stores.reduce((n,s)=>n+storeAlerts(s).length,0);
  const risk=dangerStores(ymOf(todayStr())).length;
  const deltaHtml=(d,unit)=>d==null?"":d===0?`<div class="td">先月と同じ</div>`
    :`<div class="td ${d>0?"up":"down"}">${d>0?"▲":"▼"} ${Math.abs(d)}${unit}（先月比）</div>`;
  const stateHtml=n=>n>0?`<div class="ts" style="color:var(--bad);font-weight:700">⚠ 要対応</div>`:`<div class="ts" style="color:var(--good);font-weight:700">✓ 問題なし</div>`;
  return `<div class="dash no-print">
    <div class="tile"><div class="tl">今月のチェック</div><div class="tv">${curChecks.length}<small>件</small></div>${deltaHtml(checkDelta,"件")}</div>
    <div class="tile"><div class="tl">今月の平均総合点</div><div class="tv">${curAvg!=null?curAvg:"—"}<small>${curAvg!=null?"点":""}</small></div>${deltaHtml(scoreDelta,"点")}</div>
    ${worst?`<button class="tile tile-link" data-trend="${esc(worst.store)}"><div class="tl">今月の最下位店舗</div><div class="tv small-v">${worst.brand?`<span style="font-size:11px;color:var(--sub);display:block">${esc(worst.brand)}</span>`:""}${esc(worst.store)}</div><div class="ts">${worst.score}点 ・ タップで推移</div></button>`
      :`<div class="tile"><div class="tl">今月の最下位店舗</div><div class="tv small-v">—</div><div class="ts">今月のチェックなし</div></div>`}
    <div class="tile"><div class="tl">アラート項目（全店）</div><div class="tv">${alertCount}<small>件</small></div>${stateHtml(alertCount)}</div>
    <div class="tile"><div class="tl">面談リスク店舗</div><div class="tv">${risk}<small>店</small></div>${stateHtml(risk)}</div>
  </div>`;
}

function bindAdmin(){

      st.textContent="接続成功："+String(t).trim().slice(0,40);

    metricsEditSeq++;
    metricsCfg={url,key,synced:false,at:Date.now()}; metricsMeta.cfgDeleted=false;
    await kvSet("metricsCfg",metricsCfg).catch(()=>{}); await persistMetricsMeta();   // 先に端末へ残す（圏外で書き込みが保留になっても失われない）

    if(shared){metricsCfg={...metricsCfg,synced:true}; await kvSet("metricsCfg",metricsCfg).catch(()=>{});}

const TREND_N=8; // 推移一覧に表示する直近のチェック回数

/* ---------- 共通保存（Cloud Firestore） ----------
   完了したチェックを全端末・全ユーザーで共有する。写真はドキュメント上限を
   避けるため photos コレクションに分けて保存。オフライン・未設定時は端末内
   （IndexedDB）のみで動作する。 */
let fsDb=null, fsMods=null, cloudReady=false, cloudErr="", cloudMigrated=false;
async function initCloud(){
  // 会社別サイトで config.js（会社専用のFirebase設定）が無い場合は、
  // 誤って自社のデータベースに接続しないようクラウド保存を無効にする
  if(IS_COMPANY_SITE&&!CC.firebase){ cloudErr="この会社用のFirebase設定（config.js）が未設定のため、端末内保存のみで動作しています"; return; }
  if(!SHARED_FB_CONFIG||!SHARED_FB_CONFIG.config) return;
  try{
    const V=FB_SDK_VERSION;
    const [appMod,fsMod,authMod]=await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
    ]);
    const app=appMod.getApps().length?appMod.getApp():appMod.initializeApp(SHARED_FB_CONFIG.config);
    try{ await authMod.signInAnonymously(authMod.getAuth(app)); }
    catch(e){ /* 匿名認証が無効でも、テストモードのルールなら動作する */ }
    setTimeout(()=>syncOutbox(),0); // ログイン直後の自動再送
    setTimeout(()=>cloudFetchGeminiKey(),0); // 共有AIキーの取得
    setTimeout(()=>cloudFetchGptUrl(),0);    // 共有GPTリンクの取得
    setTimeout(()=>cloudFetchClaudeKey(),0); // 共有Claudeキーの取得
    setTimeout(()=>cloudFetchMetricsCfg(),0); // 経営指標の取得先・店名対応表の取得
    fsMods=fsMod;
    fsDb=fsMod.initializeFirestore(app,{localCache:fsMod.persistentLocalCache()});
    fsMod.onSnapshot(fsMod.collection(fsDb,"inspections"),async snap=>{
      const cloudIds=new Set(snap.docs.map(d=>d.id));
      const merged=snap.docs.map(d=>d.data());
      // 未送信（クラウドに未到達）の記録も一覧・ランキングに含める
      const local=(await allInspections().catch(()=>[]))||[];
      for(const l of local){ if(l&&l.id&&!cloudIds.has(l.id)) merged.push(l); }
      state.inspections=merged;
      cloudReady=true; cloudErr="";
      // タイムアウト後などに実はクラウドへ届いていた記録は「送信済み」に直す（未送信バッジが残る問題の解消）
      try{
        const cloudBy=new Map(snap.docs.map(d=>[d.id,d.data()]));
        const obs=(await outboxAll())||[]; let fixed=false;
        for(const o of obs){
          if(o.status==="synced"||o.status==="syncing") continue;
          const c=cloudBy.get(o.id); if(!c) continue;
          const li=local.find(l=>l&&l.id===o.id);
          if(li&&li.savedAt&&c.savedAt!==li.savedAt) continue; // 端末側に新しい版がある＝まだ未送信
          o.status="synced"; o.syncedAt=new Date().toISOString(); o.lastError="";
          await outboxPut(o); fixed=true;
        }
        if(fixed) await updateSyncBar();
      }catch(e){}
      if(!cloudMigrated){
        cloudMigrated=true;
        // この端末にだけ残っている過去の記録は送信キューに載せて自動送信
        for(const insp of local){
          if(insp&&insp.id&&!cloudIds.has(insp.id)&&!pendingIds.has(insp.id)){
            await outboxPut({id:insp.id,status:"pending",attempts:0,queuedAt:new Date().toISOString()}).catch(()=>{});
          }
        }
        syncOutbox();
      }
      if(["home","trends","report"].includes(state.view)) render();
    },err=>{
      cloudErr=String(err&&err.message||err); cloudReady=false;
      if(state.view==="home"||state.view==="admin") render();
    });
  }catch(e){ cloudErr=String(e&&e.message||e); }
}
function stripPhotos(insp){
  const slim=JSON.parse(JSON.stringify(insp));
  const photos=[];
  for(const [itemId,a] of Object.entries(slim.answers||{})){
    (a.photos||[]).forEach((data,idx)=>photos.push({id:`${insp.id}_${itemId}_${idx}`,inspId:insp.id,itemId,idx,data}));
    a.photoCount=(a.photos||[]).length;
    a.photos=[];
  }
  return {slim,photos};
}
async function cloudSave(insp,ob){
  if(!fsDb) throw new Error("クラウド未接続");
  const m=fsMods;
  const {slim,photos}=stripPhotos(insp);
  // 写真を先にすべて保存し、最後に記録本体を確定する（途中失敗しても同じIDで再送＝上書きされる）
  // 送信済みの写真は outbox に記録し、再送時はスキップ（写真が多い記録も再送のたびに前進する）
  const sent=new Set((ob&&ob.sentPhotos)||[]);
  for(const ph of photos){
    if(sent.has(ph.id)) continue;
    await withTimeout(m.setDoc(m.doc(fsDb,"photos",ph.id),{...ph,tenantId:insp.tenantId||SHARED_TENANT_ID}),25000,"写真の送信がタイムアウトしました");
    if(ob){ sent.add(ph.id); ob.sentPhotos=[...sent]; await outboxPut(ob).catch(()=>{}); }
  }
  slim.tenantId=insp.tenantId||SHARED_TENANT_ID;
  slim.storeId=insp.storeId||String(insp.store||"").trim();
  if(m.serverTimestamp) slim.receivedAt=m.serverTimestamp();
  await withTimeout(m.setDoc(m.doc(fsDb,"inspections",insp.id),slim),25000,"記録の送信がタイムアウトしました");
}
async function cloudDelete(id){
  if(!fsDb) return;
  const m=fsMods;
  await m.deleteDoc(m.doc(fsDb,"inspections",id)).catch(()=>{});
  try{
    const snap=await m.getDocs(m.query(m.collection(fsDb,"photos"),m.where("inspId","==",id)));
    for(const d of snap.docs){ await m.deleteDoc(d.ref).catch(()=>{}); }
  }catch(e){}
}
// 報告書表示時に、クラウド保存の写真を読み込んで結合する
async function hydratePhotos(insp){
  const need=Object.values(insp.answers||{}).some(a=>(a.photoCount||0)>0&&!(a.photos||[]).length);
  if(!need) return false;
  // まずこの端末のフルコピーから
  try{
    const local=await getInspection(insp.id);
    if(local&&Object.values(local.answers||{}).some(a=>(a.photos||[]).length)){
      for(const [k,a] of Object.entries(local.answers||{})){
        if(insp.answers[k]&&(a.photos||[]).length) insp.answers[k].photos=a.photos;
      }
      return true;
    }
  }catch(e){}
  if(!fsDb) return false;
  try{
    const m=fsMods;
    const snap=await m.getDocs(m.query(m.collection(fsDb,"photos"),m.where("inspId","==",insp.id)));
    snap.docs.forEach(d=>{
      const p=d.data(); const a=insp.answers&&insp.answers[p.itemId];
      if(a){ a.photos=a.photos||[]; a.photos[p.idx]=p.data; }
    });
    return snap.docs.length>0;
  }catch(e){ return false; }
}
/* ---------- 送信キュー（オフライン保存・自動再送） ----------
   完了した記録はまず端末内（outbox）に pending で保存し、通信可能なときに
   クラウドへ送信する。サーバー保存の確認が取れて初めて synced になる。
   状態: draft(下書き) → pending(送信待ち) → syncing(送信中) → synced / failed */
let syncRunning=false, syncNote="", pendingIds=new Set();
function withTimeout(p,ms,msg){
  return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg||"通信がタイムアウトしました")),ms))]);
}
async function refreshPendingIds(){
  try{
    const list=(await outboxAll())||[];
    pendingIds=new Set(list.filter(o=>o.status!=="synced").map(o=>o.id));
  }catch(e){ pendingIds=new Set(); }
}
async function updateSyncBar(note){
  if(note!==undefined) syncNote=note;
  await refreshPendingIds();
  const el=document.getElementById("sync-bar");
  if(el) el.outerHTML=syncBarHtml();
}
function syncBarHtml(){
  const online=navigator.onLine;
  const n=pendingIds.size;
  return `<div id="sync-bar" class="sync-bar">
    <span class="net-dot ${online?"on":"off"}" aria-hidden="true"></span><span>${online?"オンライン":"オフライン"}</span>
    <span class="sep">・</span><span>未送信 <b>${n}</b>件</span>
    ${syncRunning?`<span class="sep">・</span><span class="spin" aria-hidden="true"></span><span>送信中…</span>`:""}
    ${syncNote&&!syncRunning?`<span class="sep">・</span><span>${esc(syncNote)}</span>`:""}
    ${n>0&&!syncRunning?`<button class="save-btn" id="sync-now">今すぐ再送</button>`:""}
  </div>`;
}
async function syncOutbox(){
  if(syncRunning) return;
  const run=async()=>{
    if(syncRunning) return;
    syncRunning=true; await updateSyncBar();
    try{
      if(!fsDb){ await updateSyncBar("クラウド未接続のため端末に保存中"); return; }
      const list=((await outboxAll())||[]).filter(o=>o.status!=="synced");
      let ok=0,ng=0;
      for(const o of list){
        if(!navigator.onLine){ ng++; break; }
        o.status="syncing"; o.attempts=(o.attempts||0)+1; await outboxPut(o);
        try{
          const insp=await getInspection(o.id);
          if(!insp){ o.status="synced"; o.syncedAt=new Date().toISOString(); await outboxPut(o); continue; }
          await cloudSave(insp,o); // タイムアウトは写真1枚ごと（大きな記録も再送で前進する）
          o.status="synced"; o.syncedAt=new Date().toISOString(); o.lastError="";
          await outboxPut(o); ok++;
        }catch(err){
          o.status="failed"; o.lastError=String(err&&err.message||err).slice(0,200);
          await outboxPut(o); ng++;
        }
      }
      if(ok&&!ng){ showToast("送信完了：クラウドに保存されました"); await updateSyncBar("送信完了"); }
      else if(ng){ showToast("送信に失敗しました。通信回復後に自動で再送します"); await updateSyncBar("送信に失敗しました"); }
      else await updateSyncBar("");
    }finally{
      syncRunning=false; await updateSyncBar();
    }
  };
  // 排他制御：同時に複数の再送処理が走らないようにする
  if(navigator.locks&&navigator.locks.request){
    await navigator.locks.request("rakuraku-sync",{ifAvailable:true},async lock=>{ if(lock) await run(); });
  }else{
    await run();
  }
}

      const prior=state.inspections.filter(i=>i.store===insp.store&&i.completedAt&&!i.provisional&&i.id!==insp.id);

      return {it,c};

    return alerts.length?`<section class="card" style="border-color:var(--bad)">

    </section>`:"";})()}
  ${CHECK_CATS.map(cat=>`
  <section class="card">
    <h3>${esc(cat.name)}</h3>
    ${cat.items.filter(it=>itemVisibleFor(it,insp.store,insp.brand)).map(it=>{
      const a=byId(it.id); const sc=itemScoreOf(it,a); const aiSc=aiScoreOf(it,a);
      const extras=(it.extras||[]).filter(f=>shown(f,a)&&filled(a.fields[f.key]))
        .map(f=>`<b>${esc(f.label)}：</b>${esc(a.fields[f.key])}${f.unit?esc(f.unit):""}`).join("／");
      return `<div class="rep-item">
        <div class="nm"><span>${esc(it.name)}</span><span style="font-variant-numeric:tabular-nums">${sc!=null?sc+"点":"—"}${it.noScore?`<span class="hw-meta">（総合点対象外）</span>`:""}${aiSc!=null?`<span class="hw-meta">（AI：${aiSc}点）</span>`:""}</span></div>
        <div class="ev">${it.groups.map(g=>{const o=g.options.find(o=>o.v===a.evals[g.key]);return o?evalBadge(o):`<span class="badge todo">未選択</span>`;}).join("")}</div>
        ${extras?`<div class="fx">${extras}</div>`:""}
        ${AI_ENABLED&&a.ai&&a.ai.reason?`<div class="fx"><b>AI判定：</b>${esc(a.ai.reason)}${a.ai.conf?`（信頼度：${esc(a.ai.conf)}）`:""}</div>`:""}
        ${a.photos.length?`<div class="photos" style="margin-top:8px">${a.photos.map((p,i)=>`<div class="ph"><img src="${p}" alt="${esc(it.name)}の写真${i+1}"></div>`).join("")}</div>`:""}
      </div>`;}).join("")}

  ${(()=>{const iv=insp.pdca.interview||{};
    const hasIv=INTERVIEW_FIELDS.some(f=>filled(iv[f.key]))||INTERVIEW_QS.some(q=>filled(iv[q.key]));
    if(!hasIv) return "";
    return `<section class="card">
      <h3>面談記録</h3>
      <div class="txt-block"><div class="k">基本情報</div>
        <div class="v">時間：${esc(iv.start||"—")}〜${esc(iv.end||"—")}／被面談者：${esc(iv.interviewee||"—")}</div></div>
      ${iv.ai?`<div class="txt-block"><div class="k">AI要約・リスク判定（補助）</div>
        <div class="v">${riskBadge(iv.ai)}${iv.ai.concerns.map(c=>` <span class="badge todo">${esc(c)}</span>`).join("")}
${esc(iv.ai.summary)}${iv.ai.reason?`
理由：${esc(iv.ai.reason)}`:""}</div></div>`:""}
      ${INTERVIEW_QS.filter(q=>filled(iv[q.key])).map(q=>`<div class="txt-block"><div class="k">${esc(q.label)}</div><div class="v">${esc(iv[q.key])}</div></div>`).join("")}
      ${!isPreview&&AI_ENABLED?`<div class="no-print" style="margin-top:10px">
        <button class="chip" data-repivai="${esc(insp.id)}" ${repIvBusy?"disabled":""}>${repIvBusy?"AIが分析中…":(iv.ai?"AIで再分析":"AIで面談を要約・リスク判定（補助）")}</button>
      </div>`:""}
    </section>`;})()}
  <section class="card">
    <h3>次回までの宿題・タスク（${insp.homework.length+insp.autoTasks.length}件）</h3>
    ${[...insp.homework,...insp.autoTasks].map(h=>`<div class="hw-item">${esc(h.text)}${h.auto?` <span class="badge todo">自動作成</span>`:""}
      <div class="hw-meta">担当：${esc(h.owner||"—")}／期限：${fmtDate(h.due)}／優先度：${esc(h.priority||"—")}</div></div>`).join("")||`<p class="empty">宿題はありません。</p>`}
  </section>`;
}
function itemScoreOf(item,a){
  let sum=0;
  for(const g of item.groups){const o=g.options.find(o=>o.v===a.evals[g.key]);if(!o)return null;sum+=o.s;}
  return Math.round(sum/item.groups.length);
}

/* ---------- 局所更新 ---------- */
function refreshCard(itemId){
  const el=document.getElementById("card-"+itemId);
  if(!el) return;
  const item=findItem(itemId); if(!item) return;
  const scrollY=window.scrollY;
  el.outerHTML=itemCard(item);
  window.scrollTo(0,scrollY);
  refreshHeader();
}
function refreshHeader(){
  const d=state.draft; if(!d) return;
  const bar=$(".progress i"); if(bar) bar.style.width=Math.round(progressRatio(d)*100)+"%";
  const meta=$(".hd .meta");
  if(meta){const list=draftItems(d);const done=list.filter(it=>itemComplete(it,ans(it.id))).length;
    meta.textContent=`${fmtDate(d.date)}／${d.inspector}　${done}/${list.length}項目`;}
  document.querySelectorAll(".cat-chip").forEach((c,i)=>{
    const mark=catDoneMark(i);
    c.innerHTML=`${i+1}. ${esc(CAT_NAMES[i])}${mark}`;
    c.classList.toggle("on",i===state.catIndex);
  });
}

    showToast("一時保存した内容を読み込みました。続きを入力してください");
    return;

document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset.photo!=null){
    const files=Array.from(t.files||[]); if(!files.length) return;
    const id=t.dataset.photo; const a=ans(id);
    let failed=0;
    for(const file of files){
      if(a.photos.length>=4) break;
      try{ a.photos.push(await compressPhoto(file)); }catch(err){ failed++; }
    }
    persistDraft(); refreshCard(id);
    if(failed) alert("一部の写真の読み込みに失敗しました。もう一度お試しください。");
    return;
  }
  if(t.dataset.field){
    const [id,key]=t.dataset.field.split(":");
    ans(id).fields[key]=t.value; persistDraft();
    if(t.tagName==="SELECT") refreshCard(id); else refreshHeader();
    return;
  }
  if(t.dataset.pdcaDate){state.draft.pdca[t.dataset.pdcaDate]=t.value;persistDraft();return;}
  if(t.dataset.iv){(state.draft.pdca.interview||(state.draft.pdca.interview={}))[t.dataset.iv]=t.value;persistDraft();return;}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.field){const [id,key]=t.dataset.field.split(":");ans(id).fields[key]=t.value;persistDraft();refreshHeader();return;}
  if(t.dataset.iv){(state.draft.pdca.interview||(state.draft.pdca.interview={}))[t.dataset.iv]=t.value;persistDraft();return;}
  if(t.dataset.hw){const [i,k]=t.dataset.hw.split(":");state.draft.pdca.homework[+i][k]=t.value;persistDraft();refreshHeader();return;}
});

  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ syncOutbox(); checkForUpdate(); } });
  syncOutbox(); // アプリ起動時の自動再送
  // 更新の見張り：60秒ごと＋画面再表示時に新バージョンを確認
  setInterval(checkForUpdate,60000);
  setTimeout(checkForUpdate,5000);
})();

/* ---------- 更新検知（UpdateNotifier） ----------
   サーバー上の index.html をキャッシュ無しで取得し、中の APP_VERSION と
   いま動いている版を比較する。新しければ「更新」バナーを出す（強制リロードはしない）。 */
var updateFound=false;
async function checkForUpdate(){
  if(updateFound||!navigator.onLine||location.protocol==="file:") return;
  try{
    const res=await fetch(location.pathname+"?uc="+Date.now(),{cache:"no-store"});
    if(!res.ok) return;
    const m=(await res.text()).match(/APP_VERSION="([^"]+)"/);
    if(m&&m[1]!==APP_VERSION){ updateFound=true; showUpdateBanner(m[1]); }
  }catch(e){}
}

/* 写真の拡大表示（タップで開く・どこをタップしても閉じる） */
function openLightbox(src){
  if(document.getElementById("lightbox")) return;
  const d=document.createElement("div");
  d.id="lightbox"; d.className="lightbox no-print";
  const img=document.createElement("img"); img.src=src; img.alt="拡大写真";
  const x=document.createElement("button"); x.className="lb-close"; x.textContent="×"; x.setAttribute("aria-label","閉じる");
  d.append(img,x);
  const close=()=>{d.remove();document.removeEventListener("keydown",onKey);};
  const onKey=ev=>{if(ev.key==="Escape")close();};
  d.addEventListener("click",close);
  document.addEventListener("keydown",onKey);
  document.body.appendChild(d);
}
function showUpdateBanner(v){
  if(document.getElementById("upd-bar")) return;
  const div=document.createElement("div");
  div.id="upd-bar"; div.className="upd-bar no-print";
  div.innerHTML=`<span>新しいバージョン（${esc(v)}）があります</span>
    <button class="upd-go" id="upd-go">更新</button>
    <button class="upd-x" id="upd-close" aria-label="閉じる">×</button>`;
  document.body.appendChild(div);
}
