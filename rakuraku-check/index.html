<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>らくらく臨店チェック</title>
</head>
<body>
<style>
:root{
  --bg:#F7F6F2; --card:#FFFFFF; --ink:#1E232B; --sub:#5C6470; --line:#E3E1DA;
  --accent:#2E4E7E; --accent-ink:#FFFFFF; --accent-soft:#E8EEF7;
  --good:#1E7F4C; --good-bg:#E3F2E9; --warn:#B26A00; --warn-bg:#FBF0DC; --bad:#BE3E36; --bad-bg:#F9E7E5;
  --shadow:0 1px 3px rgba(30,35,43,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14171C; --card:#1D2129; --ink:#E8EAEE; --sub:#99A1AD; --line:#2C323C;
    --accent:#8FB0DE; --accent-ink:#101826; --accent-soft:#25324A;
    --good:#5BC489; --good-bg:#1C3227; --warn:#E0A44E; --warn-bg:#38301D; --bad:#E37F76; --bad-bg:#3A2320;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="light"]{
  --bg:#F7F6F2; --card:#FFFFFF; --ink:#1E232B; --sub:#5C6470; --line:#E3E1DA;
  --accent:#2E4E7E; --accent-ink:#FFFFFF; --accent-soft:#E8EEF7;
  --good:#1E7F4C; --good-bg:#E3F2E9; --warn:#B26A00; --warn-bg:#FBF0DC; --bad:#BE3E36; --bad-bg:#F9E7E5;
  --shadow:0 1px 3px rgba(30,35,43,.08);
}
:root[data-theme="dark"]{
  --bg:#14171C; --card:#1D2129; --ink:#E8EAEE; --sub:#99A1AD; --line:#2C323C;
  --accent:#8FB0DE; --accent-ink:#101826; --accent-soft:#25324A;
  --good:#5BC489; --good-bg:#1C3227; --warn:#E0A44E; --warn-bg:#38301D; --bad:#E37F76; --bad-bg:#3A2320;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",YuGothic,Meiryo,system-ui,sans-serif;
  color:var(--ink); line-height:1.6; -webkit-font-smoothing:antialiased;
}
#app{max-width:640px;margin:0 auto;padding-bottom:96px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{
  font:inherit;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;
}
textarea{min-height:72px;resize:vertical}
input[type=number]{font-variant-numeric:tabular-nums}
.field{margin-top:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.04em;margin-bottom:4px}
.field .unit{font-size:12px;color:var(--sub);margin-left:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hd{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:12px 16px 0;
}
.hd .bar{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.hd h1{font-size:16px;font-weight:700}
.hd .meta{font-size:12px;color:var(--sub)}
.progress{height:4px;background:var(--line);border-radius:2px;margin:10px 0 0;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.cats{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat-chip{
  flex:0 0 auto;font-size:12px;font-weight:600;padding:7px 12px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);color:var(--sub);white-space:nowrap;
}
.cat-chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cat-chip .st{margin-left:4px}
.wrap{padding:16px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);padding:16px;margin-bottom:14px;position:relative;overflow:hidden;
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.card.done::before{background:var(--good)}
.card.issue::before{background:var(--bad)}
.card h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge.done{background:var(--good-bg);color:var(--good)}
.badge.issue{background:var(--bad-bg);color:var(--bad)}
.badge.todo{background:var(--accent-soft);color:var(--accent)}
.desc{font-size:12px;color:var(--sub);margin-top:6px}
.desc li{margin-left:1.2em}
.note{font-size:11px;color:var(--sub);margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.sec-label{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.06em;margin:14px 0 6px}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.photos .ph{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photos .ph .del{
  position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:20px;text-align:center;
}
.photo-add{
  width:72px;height:72px;border:1.5px dashed var(--accent);border-radius:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--accent);font-size:11px;font-weight:700;gap:2px;cursor:pointer;background:var(--accent-soft);
}
.photo-add span:first-child{font-size:20px;line-height:1}
.req{color:var(--bad);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{
  font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);
}
.chip.on-good{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.chip.on-warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.chip.on-bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.scale{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.scale button{
  text-align:left;width:100%;border:1.5px solid var(--line);border-radius:10px;
  padding:10px 12px;background:var(--card);font-size:13px;line-height:1.5;
}
.scale .sv{font-weight:800;font-variant-numeric:tabular-nums;margin-right:8px}
.scale .st{font-weight:700}
.scale .sd{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.scale button.on-good{background:var(--good-bg);border-color:var(--good)}
.scale button.on-good .sv,.scale button.on-good .st{color:var(--good)}
.scale button.on-warn{background:var(--warn-bg);border-color:var(--warn)}
.scale button.on-warn .sv,.scale button.on-warn .st{color:var(--warn)}
.scale button.on-bad{background:var(--bad-bg);border-color:var(--bad)}
.scale button.on-bad .sv,.scale button.on-bad .st{color:var(--bad)}
.issue-box{
  margin-top:14px;border:1px solid var(--bad);border-radius:10px;padding:12px;
  background:var(--bad-bg);
}
.issue-box .ttl{font-size:12px;font-weight:700;color:var(--bad)}
.btn{
  display:block;width:100%;text-align:center;font-weight:700;font-size:15px;
  padding:14px;border-radius:10px;background:var(--accent);color:var(--accent-ink);
}
.btn.sub{background:var(--card);color:var(--accent);border:1.5px solid var(--accent)}
.btn.ghost{background:none;color:var(--sub);border:1px solid var(--line);font-size:13px;padding:10px}
.btn:disabled{opacity:.45;cursor:default}
.navbar{
  position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--bg);
  border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
.navbar .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.navbar .btn{padding:12px}
.home-hero{padding:34px 16px 10px;text-align:left}
.home-hero .eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--accent)}
.home-hero h1{font-size:26px;font-weight:800;letter-spacing:.02em;margin-top:4px;text-wrap:balance}
.home-hero p{font-size:13px;color:var(--sub);margin-top:6px;max-width:34em}
.hw-item{border-top:1px solid var(--line);padding:10px 0;font-size:13px}
.hw-item:first-of-type{border-top:none}
.hw-meta{font-size:11px;color:var(--sub);margin-top:2px}
.hw-row{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.list-card{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left}
.list-card .sc{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
.list-card .sc small{font-size:11px;color:var(--sub);font-weight:600}
.miss{border:1px solid var(--warn);background:var(--warn-bg);border-radius:10px;padding:12px;margin-bottom:14px}
.miss .ttl{font-weight:700;color:var(--warn);font-size:13px}
.miss button{display:block;width:100%;text-align:left;font-size:13px;padding:8px 0;border-top:1px solid var(--line)}
.miss button b{color:var(--warn)}
.score-ring{
  width:104px;height:104px;border-radius:50%;margin:0 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:6px solid var(--accent);background:var(--card);
}
.score-ring b{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.score-ring span{font-size:11px;color:var(--sub)}
.rep-h{ text-align:center;padding:8px 0 4px}
.rep-h h2{font-size:20px;font-weight:800}
.rep-h .meta{font-size:12px;color:var(--sub);margin:4px 0 14px}
.rep-item{border-top:1px solid var(--line);padding:12px 0}
.rep-item .nm{font-size:14px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rep-item .ev{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.rep-item .fx{font-size:12px;margin-top:6px;color:var(--sub)}
.rep-item .fx b{color:var(--ink)}
.rep-item .photos .ph{width:56px;height:56px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.kv .cell{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.kv .cell .k{font-size:11px;color:var(--sub)}
.kv .cell .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.txt-block{margin-top:10px}
.txt-block .k{font-size:12px;font-weight:700;color:var(--sub)}
.txt-block .v{font-size:13px;white-space:pre-wrap}
.empty{font-size:13px;color:var(--sub);padding:8px 0}
.del-row{font-size:11px;color:var(--bad);font-weight:700;margin-top:6px}
.ai-box{margin-top:14px;border:1px solid var(--accent);border-radius:10px;padding:12px;background:var(--accent-soft);font-size:13px}
.ai-box .ttl{font-size:12px;font-weight:700;color:var(--accent)}
.ai-box .rsn{font-size:12px;color:var(--sub);margin-top:4px}
.ai-box .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.ai-box .sug{margin-top:4px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
@media print{
  body{background:#fff;color:#000}
  .hd,.navbar,.no-print{display:none !important}
  .card{box-shadow:none;border-color:#ccc;break-inside:avoid}
  #app{padding-bottom:0;max-width:none}
}
</style>
<div id="app" aria-live="polite"></div>
<script>
"use strict";
/* ================= データ定義 ================= */
const ISSUE_FIELDS = [
  {key:"fix",  label:"対応内容",  type:"textarea"},
  {key:"due",  label:"改善期限",  type:"date"},
  {key:"owner",label:"担当者",    type:"text"},
];
const PRIORITIES = ["高","中","低"];
// 評価オプション: v=表示, s=点数, lv=色, issue=問題扱い(対応内容・期限・担当者を登録できる)
// s5(): 5段階評価グループを生成。defs=[ [短い要約, 詳しい基準文], ... ]（5点→1点の順）
function s5(defs){
  const meta=[["5点",100,"good",false],["4点",75,"good",false],["3点",50,"warn",true],["2点",25,"bad",true],["1点",0,"bad",true]];
  return {key:"main",label:"評価（5段階）",scale:true,
    options:meta.map(([v,s,lv,issue],i)=>({v,s,lv,issue,t:defs[i][0],desc:defs[i][1]||""}))};
}
// 汎用の5段階評価基準
const G5=[["非常に良い",""],["良い",""],["普通",""],["改善が必要",""],["早急な改善が必要",""]];
const CHECK_CATS = [
  { id:"exterior", name:"店舗外観・入口", short:"外観・入口", items:[
    { id:"lighting", name:"照明・看板・提灯・周辺POP",
      desc:["店舗外観の電気・看板・提灯が正常に点灯しており、周辺POPに汚れや破損がないか"],
      groups:[s5([
        ["すべて正常","すべて正常に点灯しており、周辺POPにも汚れや破損がない"],
        ["POPに軽い乱れ","すべて点灯しているが、周辺POPに軽い汚れや乱れがある"],
        ["一部暗い・軽微な汚損","一部の照明が暗い、または周辺POPに軽微な汚れ・破損がある"],
        ["複数消灯・目立つ汚損","複数箇所が点灯していない、または周辺POPに目立つ汚れ・破損がある"],
        ["ほとんど消灯","ほとんど点灯していない、または周辺POPが著しく汚れている・破損している"]])],
      note:"将来的には写真から点灯状態をAIで自動判定します。" },
    { id:"entrance", name:"入口",
      desc:["入口・階段・店舗前が清掃されているか"],
      groups:[s5(G5)],
      extras:[
        {key:"reason",label:"清掃できていない理由",type:"textarea",show:a=>["1点","2点"].includes(a.evals.main),req:true},
        {key:"cleanReq",label:"清掃会社への依頼が必要か",type:"select",options:["必要","不要"],show:a=>["1点","2点"].includes(a.evals.main),req:true,
         hint:"「必要」を選ぶと、完了時に清掃依頼タスクを自動作成します。"},
      ] },
  ]},
  { id:"hall", name:"ホール", short:"ホール", items:[
    { id:"tables", name:"テーブル",
      desc:["店内の全テーブルを清掃できているか"],
      groups:[s5(G5)] },
    { id:"condiments", name:"メニュー",
      desc:["メニューが整理され、汚れや破損がないか","箸・調味料・卓上備品が整っているか","不足しているものがないか"],
      groups:[s5(G5)],
      extras:[{key:"detail",label:"不足・破損内容",type:"textarea",show:a=>hasIssueEval(a,"condiments"),req:true}] },
    { id:"chairs", name:"椅子",
      desc:["椅子の汚れ・破損・ぐらつきがないか","必要数が足りているか"],
      groups:[s5(G5)],
      extras:[
        {key:"shortage",label:"不足数",type:"number",unit:"脚",show:a=>hasIssueEval(a,"chairs"),req:true},
        {key:"broken",label:"破損数",type:"number",unit:"脚",show:a=>hasIssueEval(a,"chairs"),req:true}] },
    { id:"hall_floor", name:"ホール・床",
      desc:["ホール・床が清掃され、きれいに保たれているか"],
      groups:[s5(G5)] },
  ]},
  { id:"kitchen", name:"キッチン", short:"キッチン", items:[
    { id:"fridge", name:"冷蔵庫温度",
      desc:["冷蔵庫・冷凍庫の温度が正常か"], photoLabel:"温度表示部分の写真",
      groups:[{key:"main",label:"評価",options:[
        {v:"正常",s:100,lv:"good"},
        {v:"注意",s:50,lv:"warn"},
        {v:"異常",s:0,lv:"bad",issue:true}]}],
      extras:[
        {key:"reportTo",label:"報告先",type:"text",show:a=>a.evals.main==="異常"}] },
    ...[["cutting_board","まな板"],["knife","包丁"],["duster","ダスター"]].map(([id,label])=>(
    { id, name:label,
      desc:["汚れ・欠け・破損・劣化がないか","衛生的に管理されているか"],
      groups:[s5([
        ["清潔・良好","清潔で状態も良好"],
        ["軽い汚れ","おおむね清潔だが、軽い汚れがある"],
        ["要洗浄","汚れが目立ち、洗浄・漂白が必要"],
        ["欠け・破損あり","欠け・破損・劣化がある"],
        ["要買い替え","使用に適さず、買い替えが必要"]])],
      extras:[{key:"buyList",label:"買い替え対象と数量",type:"textarea",show:a=>a.evals.main==="1点",req:true,
        hint:"完了時に購入・交換タスクを自動作成します。"}] })),
    { id:"fryer", name:"フライヤー",
      desc:["清掃されているか","油の色や状態が正常か"],
      groups:[
        {...s5([
          ["清掃済み","きれいに清掃され、油汚れがない"],
          ["軽い汚れ","おおむね清掃されているが、軽い油汚れがある"],
          ["汚れが目立つ","油汚れが目立つ"],
          ["清掃不足","清掃されておらず、汚れがひどい"],
          ["衛生上問題","著しく汚れ、衛生上問題がある"]]),key:"clean",label:"清掃状態（5段階）"},
        {key:"oil",label:"油の状態",options:[
          {v:"正常",s:100,lv:"good"},{v:"交換推奨",s:50,lv:"warn",issue:true},{v:"交換が必要",s:0,lv:"bad",issue:true}]}] },
    { id:"stove", name:"コンロ",
      desc:["清掃されているか","正常な青い火が出ているか"],
      groups:[s5([
        ["正常","清掃されており、正常な青い火が出ている"],
        ["軽い汚れ","火は正常だが、軽い汚れがある"],
        ["要清掃","清掃が必要"],
        ["火に異常","火の色・強さに異常がある"],
        ["点火しない","点火しない"]])] },
    { id:"garbage", name:"ゴミ置き場・ゴミ箱",
      desc:["ゴミ置き場が整理されているか","ゴミ箱が清掃されているか","臭い・汚れ・害虫の発生がないか"],
      groups:[s5([
        ["問題なし","整理・清掃されており、臭い・害虫もない"],
        ["ほぼ良好","おおむね良好だが、軽い汚れ・臭いがある"],
        ["一部問題","汚れ・臭いが一部気になる"],
        ["要改善","整理されておらず、汚れ・臭いが目立つ"],
        ["不衛生","著しく不衛生で、害虫発生の恐れがある"]])],
      extras:[{key:"detail",label:"問題内容",type:"textarea",show:a=>hasIssueEval(a,"garbage"),req:true}] },
  ]},
  { id:"sales", name:"営業・商品品質", short:"営業・品質", items:[
    { id:"peak", name:"ピーク帯・オペレーション力",
      desc:["ピーク帯でもスムーズに営業できているか","「0秒スピード」が実践できているか"], photoLabel:"現場写真",
      groups:[s5(G5)] },
    { id:"service", name:"接客・笑顔",
      desc:["「0秒スマイル」が実践できているか","大きな声で「いらっしゃいませ」と挨拶できているか","笑顔で接客できているか"], photoOptional:true,
      groups:[s5(G5)] },
    { id:"quality", name:"商品品質",
      desc:["味・温度・見た目・量・盛り付けが基準通りか"], photoOptional:true,
      groups:[s5([
        ["基準通り","味・温度・見た目・量すべて基準通り"],
        ["ほぼ基準通り","おおむね基準通り"],
        ["一部基準外","一部が基準から外れている"],
        ["基準外が複数","複数の項目で基準から外れている"],
        ["基準未達","提供基準を満たしていない"]])],
      extras:[
        {key:"product",label:"問題商品名",type:"text",show:a=>hasIssueEval(a,"quality"),req:true},
        {key:"improve",label:"改善内容",type:"textarea",show:a=>hasIssueEval(a,"quality"),req:true}] },
  ]},
  { id:"fives", name:"5S", short:"5S", items:[
    { id:"uniform", name:"ユニフォーム",

let db=null;
const state = { view:"home", catIndex:0, draft:null, inspections:[], reportId:null, fb:null };

function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open("rakuraku-check",1);
  r.onupgradeneeded=e=>{const d=e.target.result;d.createObjectStore("kv");d.createObjectStore("inspections",{keyPath:"id"});};
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});}
function tx(store,mode,fn){return new Promise((res,rej)=>{
  const t=db.transaction(store,mode),s=t.objectStore(store),q=fn(s);
  t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error);});}
const kvGet=k=>tx("kv","readonly",s=>s.get(k));
const kvSet=(k,v)=>tx("kv","readwrite",s=>s.put(v,k));
const kvDel=k=>tx("kv","readwrite",s=>s.delete(k));
const putInspection=i=>tx("inspections","readwrite",s=>s.put(i));
const allInspections=()=>tx("inspections","readonly",s=>s.getAll());

let saveTimer=null;
function persistDraft(){
  if(!state.draft) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>kvSet("draft",state.draft).catch(()=>{}),400);
}

const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtDate(s){if(!s)return "—";const [y,m,d]=s.split("-");return `${y}/${+m}/${+d}`;}
function findItem(id){return ALL_ITEMS.find(i=>i.id===id);}
function ans(id){if(!state.draft.answers[id])state.draft.answers[id]={photos:[],evals:{},fields:{}};return state.draft.answers[id];}
function hasIssueEval(a,itemId){
  const item=findItem(itemId);
  return item.groups.some(g=>{const o=g.options.find(o=>o.v===a.evals[g.key]);return o&&o.issue;});
}
function isIssue(item,a){return hasIssueEval(a,item.id);}
function shown(f,a){return f.show?f.show(a):true;}
function filled(v){return String(v??"").trim()!=="";}
function itemComplete(item,a){
  if(!item.photoOptional&&!a.photos.length) return false;
  for(const g of item.groups){ if(!a.evals[g.key]) return false; }
  for(const f of (item.extras||[])){ if(shown(f,a)&&f.req&&!filled(a.fields[f.key])) return false; }
  return true;
}
function itemScore(item,a){
  let sum=0;
  for(const g of item.groups){
    const o=g.options.find(o=>o.v===a.evals[g.key]);
    if(!o) return null; sum+=o.s;
  }
  return Math.round(sum/item.groups.length);
}
function totalScore(draft){
  const ss=ALL_ITEMS.map(it=>itemScore(it,draft.answers[it.id]||{photos:[],evals:{},fields:{}})).filter(s=>s!=null);
  return ss.length?Math.round(ss.reduce((a,b)=>a+b,0)/ss.length):0;
}
function computeAutoTasks(draft){

  if(e&&e.fields.cleanReq==="必要")

}
function issueItems(draft){

}
function pdcaComplete(draft){

}
function progressRatio(draft){
  const done=ALL_ITEMS.filter(it=>itemComplete(it,ans(it.id))).length + (pdcaComplete(draft)?1:0);
  return done/(ALL_ITEMS.length+1);
}
function collectMissing(){
  const m=[]; const d=state.draft;
  CHECK_CATS.forEach((cat,ci)=>cat.items.forEach(item=>{
    const a=ans(item.id);
    if(!item.photoOptional&&!a.photos.length) m.push({ci,id:item.id,label:item.name,what:"写真が未添付"});
    for(const g of item.groups){ if(!a.evals[g.key]) m.push({ci,id:item.id,label:item.name,what:`「${g.label}」が未選択`}); }
    for(const f of (item.extras||[])){ if(shown(f,a)&&f.req&&!filled(a.fields[f.key])) m.push({ci,id:item.id,label:item.name,what:`「${f.label}」が未入力`}); }
  }));
  d.pdca.homework.forEach((h,i)=>{ if(!filled(h.text)) m.push({ci:PDCA_CAT,id:"pdca-homework",label:"次回までの宿題",what:`宿題${i+1}の内容が未入力`}); });
  return m;
}
function compressPhoto(file){return new Promise((res,rej)=>{
  const img=new Image(); const url=URL.createObjectURL(file);
  img.onload=()=>{
    const MAX=1000; let w=img.naturalWidth,h=img.naturalHeight;
    const sc=Math.min(1,MAX/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    cv.getContext("2d").drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg",0.72));
  };
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("画像を読み込めません"));};
  img.src=url;});}

/* ================= AI自動判定（Firebase AI Logic / Gemini） =================
   一時的に無効化中。再度有効にするには下の FEATURE_AI を true にするか、
   URLに ?ai=on を付けて開く（例：https://.../rakuraku-check/?ai=on）。 */
const FEATURE_AI=false;
const AI_ENABLED=FEATURE_AI||new URLSearchParams(location.search).get("ai")==="on";
const FB_SDK_VERSION="11.10.0";
const DEFAULT_AI_MODEL="gemini-3.5-flash";
const KNOWN_MODELS=[
  ["gemini-3.5-flash","gemini-3.5-flash（推奨・無料枠あり）"],
  ["gemini-3.1-pro","gemini-3.1-pro（高精度・有料プラン向け）"],
];
let aiModel=null;
const aiBusy=new Set(), aiErr=new Map();
function aiConfigured(){return !!(state.fb&&state.fb.config&&state.fb.config.apiKey);}
function parseFirebaseConfig(text){
  text=String(text||"").trim(); if(!text) return null;
  try{const o=JSON.parse(text); if(o&&o.apiKey) return o;}catch(e){}
  // コンソールからコピーした「const firebaseConfig = { apiKey: "..." }」形式にも対応
  const o={};
  for(const m of text.matchAll(/([A-Za-z][A-Za-z0-9]*)\s*:\s*["']([^"']*)["']/g)) o[m[1]]=m[2];
  return o.apiKey?o:null;
}
async function getAIModel(){
  if(aiModel) return aiModel;
  if(!aiConfigured()) throw new Error("Firebase設定が未登録です。ホーム画面の「写真AI自動判定の設定」から登録してください。");
  let appMod,aiMod;
  try{
    [appMod,aiMod]=await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${FB_SDK_VERSION}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${FB_SDK_VERSION}/firebase-ai.js`),
    ]);
  }catch(e){ throw new Error("Firebase SDKを読み込めませんでした。ネットワーク接続を確認してください（プレビュー環境では外部接続がブロックされる場合があります）。"); }
  const app=appMod.getApps().length?appMod.getApp():appMod.initializeApp(state.fb.config);
  const ai=aiMod.getAI(app,{backend:new aiMod.GoogleAIBackend()});
  aiModel=aiMod.getGenerativeModel(ai,{model:state.fb.model||DEFAULT_AI_MODEL});
  return aiModel;
}
function buildJudgePrompt(item){
  const groups=item.groups.map(g=>`- ${g.key}（${g.label}）：${g.options.map(o=>o.v+(o.desc?`（${o.desc}）`:"")).join(" ／ ")}`).join("\n");
  return `あなたは飲食店の店舗巡回チェックの検査員です。添付の写真を確認し、次のチェック項目を判定してください。
チェック項目：${item.name}
確認内容：${item.desc.join("、")}
評価グループと選択肢：
${groups}
写真から判断できる範囲で、各評価グループについて最も適切な選択肢を1つずつ、選択肢の文言そのままで選んでください。
次のJSONのみを出力してください（コードブロックや説明文は不要）：
{"judgments":{${item.groups.map(g=>`"${g.key}":"選択肢の文言"`).join(",")}},"reason":"判定理由を60字以内","confidence":"高か中か低"}`;
}
function friendlyAIError(err){
  const s=String(err&&err.message||err);
  if(/no longer available|not found|404/i.test(s))
    return `このモデルは提供終了または利用できません。設定でモデルを「${DEFAULT_AI_MODEL}」に変更して保存し、再試行してください。`;
  if(/limit:\s*0/.test(s)&&/quota/i.test(s))
    return `選択中のモデルには無料枠がありません。モデルを「${DEFAULT_AI_MODEL}」に変更して保存し、再試行してください。`;
  if(/429|quota|rate.?limit/i.test(s))
    return "無料枠の利用上限に達しました。1分ほど待ってから再試行してください。";
  if(/403|permission|not.?enabled|api.?key/i.test(s))
    return "アクセスが拒否されました。Firebaseコンソールで「Firebase AI Logic」が有効か、APIキーの制限設定を確認してください。詳細："+s.slice(0,120);
  return s;
}
function parseAIJson(text){
  text=String(text||"").replace(/```(?:json)?/g,"");
  const s=text.indexOf("{"),e=text.lastIndexOf("}");
  if(s<0||e<=s) return null;
  try{return JSON.parse(text.slice(s,e+1));}catch(err){return null;}
}
async function judgeItem(itemId){
  const item=findItem(itemId); if(!item) return;
  const a=ans(itemId);
  if(!a.photos.length){alert("先に写真を追加してください。");return;}
  if(!aiConfigured()){alert("ホーム画面の「写真AI自動判定の設定」でFirebase設定を登録すると利用できます。");return;}
  if(aiBusy.has(itemId)) return;
  aiBusy.add(itemId); aiErr.delete(itemId); refreshCard(itemId);
  try{
    const model=await getAIModel();
    const parts=a.photos.map(p=>({inlineData:{mimeType:"image/jpeg",data:p.split(",")[1]}}));
    const res=await model.generateContent([...parts,buildJudgePrompt(item)]);
    const out=parseAIJson(res.response.text());
    if(!out||!out.judgments) throw new Error("AIの応答を解釈できませんでした。もう一度お試しください。");
    a.ai={suggest:out.judgments,reason:out.reason||"",conf:out.confidence||"",at:todayStr()};
    persistDraft();
  }catch(err){
    aiErr.set(itemId,friendlyAIError(err));
  }finally{
    aiBusy.delete(itemId); refreshCard(itemId);
  }
}
function applyAISuggestion(itemId){
  const item=findItem(itemId); const a=ans(itemId);
  if(!a.ai||!a.ai.suggest) return;
  for(const g of item.groups){
    const v=a.ai.suggest[g.key];
    if(g.options.some(o=>o.v===v)) a.evals[g.key]=v;
  }
  persistDraft(); refreshCard(itemId);
}
function aiSection(item,a){
  if(!AI_ENABLED) return "";
  if(!a.photos.length||!item.groups.length) return "";
  if(aiBusy.has(item.id)) return `<div class="ai-box"><span class="spin" aria-hidden="true"></span>AIが写真を判定しています…</div>`;
  const err=aiErr.get(item.id);
  if(a.ai&&a.ai.suggest){
    const rows=item.groups.map(g=>{
      const v=a.ai.suggest[g.key];
      const o=g.options.find(o=>o.v===v);
      return o?`<div class="sug">${esc(g.label)}：<b>${esc(v)}</b></div>`:"";
    }).join("");
    const applied=item.groups.every(g=>{
      const v=a.ai.suggest[g.key];
      return !g.options.some(o=>o.v===v)||a.evals[g.key]===v;
    });
    return `<div class="ai-box">
      <div class="ttl">AI判定の提案${a.ai.conf?`（信頼度：${esc(a.ai.conf)}）`:""}</div>
      ${rows}
      ${a.ai.reason?`<div class="rsn">${esc(a.ai.reason)}</div>`:""}
      <div class="acts">
        ${applied?`<span class="badge done">評価に反映済み</span>`:`<button class="chip" data-aiapply="${item.id}">提案を評価に反映</button>`}
        <button class="chip" data-ai="${item.id}">再判定</button>
      </div>
    </div>`;
  }
  return `<div class="ai-box">
    ${err?`<div class="rsn" style="color:var(--bad);margin-bottom:6px">${esc(err)}</div>`:""}
    <button class="chip" data-ai="${item.id}">写真からAI自動判定</button>
    ${aiConfigured()?"":`<div class="rsn">ホーム画面でFirebase設定を登録すると利用できます。</div>`}
  </div>`;
}

      ${hw.length?hw.map(h=>`<div class="hw-item">${esc(h.text)}<div class="hw-meta">担当：${esc(h.owner||"—")}／期限：${fmtDate(h.due)}／優先度：${esc(h.priority||"—")}${h.auto?"／自動作成タスク":""}</div></div>`).join("")
        :`<p class="empty">前回の宿題はありません。</p>`}`:"";
  };
  storeIn?.addEventListener("input",renderPrev);
  $("#start")?.addEventListener("click",async()=>{
    const store=storeIn.value.trim(), inspector=$("#f-inspector").value.trim(), date=$("#f-date").value||todayStr();
    if(!store||!inspector){alert("店舗名と確認者を入力してください。");return;}
    if(state.draft && !confirm("進行中の下書きを破棄して新しく開始しますか？")) return;
    const last=lastInspectionFor(store);
    state.draft={
      id:"insp-"+Date.now().toString(36), store, inspector, date,
      startedAt:new Date().toISOString(), answers:{},
      pdca:{ homework:[],nextVisit:"",interview:{} },
      prevDate:last?last.date:"",
    };
    persistDraft(); state.view="check"; state.catIndex=0; render(); scrollTo(0,0);
  });
  $("#resume")?.addEventListener("click",()=>{state.view="check";render();scrollTo(0,0);});
  $("#discard")?.addEventListener("click",async()=>{
    if(!confirm("下書きを破棄しますか？入力内容と写真は失われます。"))return;
    state.draft=null; await kvDel("draft"); render();
  });
  document.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>{
    state.reportId=b.dataset.open; state.view="report"; render(); scrollTo(0,0);
  }));
  $("#fb-save")?.addEventListener("click",async()=>{
    const status=$("#fb-status");
    const cfg=parseFirebaseConfig($("#fb-config").value);
    if(!cfg){status.textContent="設定を読み取れませんでした。apiKeyを含むfirebaseConfigを貼り付けてください。";return;}
    state.fb={config:cfg,model:($("#fb-model-custom").value.trim()||$("#fb-model").value),auto:!!$("#fb-auto").value};
    aiModel=null;
    await kvSet("fb",state.fb).catch(()=>{});
    render();
    const st=$("#fb-status"); if(st) st.textContent="保存しました。「接続テスト」で動作確認できます。";
  });
  $("#fb-test")?.addEventListener("click",async()=>{
    const status=$("#fb-status");
    status.textContent="接続テスト中…";
    try{
      const cfg=parseFirebaseConfig($("#fb-config").value);
      if(cfg){
        state.fb={config:cfg,model:($("#fb-model-custom").value.trim()||$("#fb-model").value),auto:!!$("#fb-auto").value};
        aiModel=null; await kvSet("fb",state.fb).catch(()=>{});
      }
      const m=await getAIModel();
      const r=await m.generateContent("接続テストです。「OK」とだけ返してください。");
      status.textContent="接続成功："+r.response.text().trim().slice(0,40);
    }catch(err){
      status.textContent="接続失敗："+friendlyAIError(err);
    }
  });
}

/* ---------- チェック画面 ---------- */
function viewCheck(){
  const d=state.draft;
  const doneItems=ALL_ITEMS.filter(it=>itemComplete(it,ans(it.id))).length;
  const pct=Math.round(progressRatio(d)*100);
  let body="";
  if(state.catIndex<PDCA_CAT) body=CHECK_CATS[state.catIndex].items.map(itemCard).join("");
  else if(state.catIndex===PDCA_CAT) body=pdcaView();
  else body=finishView();
  return `
  <header class="hd">
    <div class="bar">
      <h1>${esc(d.store)}</h1>
      <span class="meta">${fmtDate(d.date)}／${esc(d.inspector)}　${doneItems}/${ALL_ITEMS.length}項目${pdcaComplete(d)?"＋PDCA":""}</span>
    </div>
    <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <nav class="cats">${CAT_NAMES.map((n,i)=>`<button class="cat-chip${i===state.catIndex?" on":""}" data-cat="${i}">${i+1}. ${esc(n)}${catDoneMark(i)}</button>`).join("")}</nav>
  </header>
  <div class="wrap">${body}</div>
  <div class="navbar"><div class="in">
    ${state.catIndex>0?`<button class="btn sub" data-nav="-1">前へ</button>`:`<button class="btn ghost" id="to-home">ホーム</button>`}
    ${state.catIndex<REPORT_CAT?`<button class="btn" data-nav="1">次へ：${esc(CAT_NAMES[state.catIndex+1])}</button>`:""}
  </div></div>`;
}
function catDoneMark(i){
  if(!state.draft) return "";
  if(i<PDCA_CAT){ const ok=CHECK_CATS[i].items.every(it=>itemComplete(it,ans(it.id))); return ok?` <span class="st">✓</span>`:""; }
  if(i===PDCA_CAT) return pdcaComplete(state.draft)?` <span class="st">✓</span>`:"";
  return "";
}
function itemCard(item){
  const a=ans(item.id);
  const complete=itemComplete(item,a), issue=isIssue(item,a);
  const badge=complete?(issue?`<span class="badge issue">問題あり・登録済</span>`:`<span class="badge done">完了</span>`)
    :(issue?`<span class="badge issue">問題あり</span>`:`<span class="badge todo">未完了</span>`);
  return `
  <section class="card ${complete?"done":""} ${issue?"issue":""}" id="card-${item.id}">
    <h3>${esc(item.name)} ${badge}</h3>
    <ul class="desc">${item.desc.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
    <div class="sec-label">${esc(item.photoLabel||"写真")} ${item.photoOptional?`<span style="color:var(--sub);font-weight:600">任意</span>`:`<span class="req">必須</span>`}</div>
    <div class="photos">
      ${a.photos.map((p,i)=>`<div class="ph"><img src="${p}" alt="${esc(item.name)}の写真${i+1}"><button class="del" data-delph="${item.id}:${i}" aria-label="写真を削除">×</button></div>`).join("")}
      ${a.photos.length<4?`<label class="photo-add"><span>＋</span><span>撮影・追加</span><input type="file" accept="image/*" capture="environment" hidden data-photo="${item.id}"></label>`:""}
    </div>
    ${item.groups.map(g=>`
      <div class="sec-label">${esc(g.label)} <span class="req">必須</span></div>
      ${g.scale?`
      <div class="scale" role="group" aria-label="${esc(g.label)}">
        ${g.options.map(o=>`<button class="${a.evals[g.key]===o.v?"on-"+o.lv:""}" data-eval="${item.id}:${g.key}:${esc(o.v)}" aria-pressed="${a.evals[g.key]===o.v}">
          <span class="sv">${esc(o.v)}</span><span class="st">${esc(o.t)}</span>
          ${o.desc?`<span class="sd">${esc(o.desc)}</span>`:""}
        </button>`).join("")}
      </div>`:`
      <div class="chips" role="group" aria-label="${esc(g.label)}">
        ${g.options.map(o=>`<button class="chip${a.evals[g.key]===o.v?" on-"+o.lv:""}" data-eval="${item.id}:${g.key}:${esc(o.v)}" aria-pressed="${a.evals[g.key]===o.v}">${esc(o.v)}</button>`).join("")}
      </div>`}`).join("")}
    ${aiSection(item,a)}
    ${(item.extras||[]).filter(f=>shown(f,a)).map(f=>fieldHtml(item.id,f,a)).join("")}
    ${issue?issueBox(item.id,a):""}
    ${item.note?`<p class="note">${esc(item.note)}</p>`:""}
  </section>`;
}
function fieldHtml(itemId,f,a){
  const v=a.fields[f.key]??"";
  const label=`<label>${esc(f.label)}${f.unit?`<span class="unit">（${esc(f.unit)}）</span>`:""} ${f.req?'<span class="req">必須</span>':""}</label>`;
  let input="";
  if(f.type==="textarea") input=`<textarea data-field="${itemId}:${f.key}">${esc(v)}</textarea>`;
  else if(f.type==="select") input=`<select data-field="${itemId}:${f.key}"><option value="">選択してください</option>${f.options.map(o=>`<option${v===o?" selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else input=`<input type="${f.type}" ${f.min!=null?`min="${f.min}"`:""} ${f.max!=null?`max="${f.max}"`:""} value="${esc(v)}" data-field="${itemId}:${f.key}" ${f.type==="number"?'inputmode="decimal"':""}>`;
  return `<div class="field">${label}${input}${f.hint?`<p class="note" style="border:none;padding-top:4px;margin-top:2px">${esc(f.hint)}</p>`:""}</div>`;
}
function issueBox(itemId,a){
  return `<div class="issue-box">
    <div class="ttl">問題あり — 必要に応じて対応内容・改善期限・担当者を登録できます（任意）</div>
    ${ISSUE_FIELDS.map(f=>fieldHtml(itemId,f,a)).join("")}
  </div>`;
}

/* ---------- 完了・報告 ---------- */
function finishView(){
  const missing=collectMissing();
  if(missing.length){
    return `
    <div class="miss">
      <div class="ttl">未入力・写真未添付の項目があるため完了できません（${missing.length}件）</div>
      ${missing.map(m=>`<button data-jump="${m.ci}:${m.id}"><b>${esc(m.label)}</b>：${esc(m.what)}</button>`).join("")}
    </div>
    ${reportBody(previewInspection(),true)}`;
  }
  return `
  <div class="card no-print" style="text-align:center">
    <h3 style="justify-content:center">すべての項目が入力済みです</h3>
    <p class="desc" style="margin:8px 0 12px">内容を確認して完了すると、報告書が保存され、宿題が次回に引き継がれます。</p>
    <button class="btn" id="finalize">チェックを完了して報告書を保存</button>
  </div>
  ${reportBody(previewInspection(),true)}`;
}
function previewInspection(){
  const d=state.draft;
  return buildInspection(d,true);
}
function buildInspection(d,preview){
  const autoTasks=computeAutoTasks(d);
  return {
    id:d.id, store:d.store, inspector:d.inspector, date:d.date,
    startedAt:d.startedAt, completedAt:preview?"":new Date().toISOString(),
    answers:d.answers, pdca:d.pdca, prevDate:d.prevDate,
    totalScore:totalScore(d),
    issues:issueItems(d).map(it=>it.id),
    autoTasks,
    homework:d.pdca.homework.filter(h=>filled(h.text)),
  };
}
function viewReport(){
  const insp=state.inspections.find(i=>i.id===state.reportId);
  if(!insp) return `<div class="wrap"><p class="empty">報告書が見つかりません。</p><button class="btn" id="to-home">ホームへ</button></div>`;
  return `
  <header class="hd no-print"><div class="bar" style="padding-bottom:10px">
    <h1>報告書</h1><span class="meta">${esc(insp.store)}／${fmtDate(insp.date)}</span>
  </div></header>
  <div class="wrap">
    ${reportBody(insp,false)}
    <div class="no-print" style="display:flex;gap:10px;margin-top:4px">
      <button class="btn sub" onclick="window.print()">印刷・PDF保存</button>
      <button class="btn" id="to-home">ホームへ戻る</button>
    </div>
  </div>`;
}
function evalBadge(o){return `<span class="badge ${o.issue?"issue":(o.lv==="good"?"done":"todo")}">${esc(o.v)}${o.t?"・"+esc(o.t):""}</span>`;}
function reportBody(insp,isPreview){
  const byId=id=>insp.answers[id]||{photos:[],evals:{},fields:{}};
  const issueList=ALL_ITEMS.filter(it=>insp.issues.includes(it.id));
  return `
  <section class="card">
    <div class="rep-h">
      <h2>${esc(insp.store)}　店舗チェック報告書${isPreview?"（プレビュー）":""}</h2>
      <div class="meta">確認日：${fmtDate(insp.date)}　確認者：${esc(insp.inspector)}${insp.prevDate?`　前回：${fmtDate(insp.prevDate)}`:""}</div>
      <div class="score-ring"><b>${insp.totalScore}</b><span>総合点／100</span></div>
    </div>
  </section>
  <section class="card">
    <h3>問題があった項目（${issueList.length}件）</h3>
    ${issueList.length?issueList.map(it=>{
      const a=byId(it.id);
      return `<div class="rep-item">
        <div class="nm">${esc(it.name)}</div>
        <div class="ev">${it.groups.map(g=>{const o=g.options.find(o=>o.v===a.evals[g.key]);return o?evalBadge(o):"";}).join("")}</div>
        <div class="fx"><b>対応内容：</b>${esc(a.fields.fix||"—")}／<b>期限：</b>${fmtDate(a.fields.due)}／<b>担当：</b>${esc(a.fields.owner||"—")}</div>
      </div>`;}).join(""):`<p class="empty">問題のあった項目はありません。</p>`}
  </section>
  ${CHECK_CATS.map(cat=>`
  <section class="card">
    <h3>${esc(cat.name)}</h3>
    ${cat.items.map(it=>{
      const a=byId(it.id); const sc=itemScoreOf(it,a);
      const extras=(it.extras||[]).filter(f=>shown(f,a)&&filled(a.fields[f.key]))
        .map(f=>`<b>${esc(f.label)}：</b>${esc(a.fields[f.key])}${f.unit?esc(f.unit):""}`).join("／");
      return `<div class="rep-item">
        <div class="nm"><span>${esc(it.name)}</span><span style="font-variant-numeric:tabular-nums">${sc!=null?sc+"点":"—"}</span></div>
        <div class="ev">${it.groups.map(g=>{const o=g.options.find(o=>o.v===a.evals[g.key]);return o?evalBadge(o):`<span class="badge todo">未選択</span>`;}).join("")}</div>
        ${extras?`<div class="fx">${extras}</div>`:""}
        ${AI_ENABLED&&a.ai&&a.ai.reason?`<div class="fx"><b>AI判定：</b>${esc(a.ai.reason)}${a.ai.conf?`（信頼度：${esc(a.ai.conf)}）`:""}</div>`:""}
        ${a.photos.length?`<div class="photos" style="margin-top:8px">${a.photos.map((p,i)=>`<div class="ph"><img src="${p}" alt="${esc(it.name)}の写真${i+1}"></div>`).join("")}</div>`:""}
      </div>`;}).join("")}
  </section>`).join("")}
  ${(()=>{const iv=insp.pdca.interview||{};
    const hasIv=INTERVIEW_FIELDS.some(f=>filled(iv[f.key]))||INTERVIEW_QS.some(q=>filled(iv[q.key]));
    if(!hasIv) return "";
    return `<section class="card">
      <h3>面談記録</h3>
      <div class="txt-block"><div class="k">基本情報</div>
        <div class="v">面談日：${fmtDate(iv.date)}／時間：${esc(iv.start||"—")}〜${esc(iv.end||"—")}／面談者：${esc(iv.interviewer||"—")}／被面談者：${esc(iv.interviewee||"—")}</div></div>
      ${INTERVIEW_QS.filter(q=>filled(iv[q.key])).map(q=>`<div class="txt-block"><div class="k">${esc(q.label)}</div><div class="v">${esc(iv[q.key])}</div></div>`).join("")}
    </section>`;})()}
  <section class="card">
    <h3>次回までの宿題・タスク（${insp.homework.length+insp.autoTasks.length}件）</h3>
    ${[...insp.homework,...insp.autoTasks].map(h=>`<div class="hw-item">${esc(h.text)}${h.auto?` <span class="badge todo">自動作成</span>`:""}
      <div class="hw-meta">担当：${esc(h.owner||"—")}／期限：${fmtDate(h.due)}／優先度：${esc(h.priority||"—")}</div></div>`).join("")||`<p class="empty">宿題はありません。</p>`}
    <div class="txt-block"><div class="k">次回来店予定日</div><div class="v">${fmtDate(insp.pdca.nextVisit)}</div></div>
  </section>`;
}
function itemScoreOf(item,a){
  let sum=0;
  for(const g of item.groups){const o=g.options.find(o=>o.v===a.evals[g.key]);if(!o)return null;sum+=o.s;}
  return Math.round(sum/item.groups.length);
}

/* ---------- 局所更新 ---------- */
function refreshCard(itemId){
  const el=document.getElementById("card-"+itemId);
  if(!el) return;
  const item=findItem(itemId); if(!item) return;
  const scrollY=window.scrollY;
  el.outerHTML=itemCard(item);
  window.scrollTo(0,scrollY);
  refreshHeader();
}
function refreshHeader(){
  const d=state.draft; if(!d) return;
  const bar=$(".progress i"); if(bar) bar.style.width=Math.round(progressRatio(d)*100)+"%";
  const meta=$(".hd .meta");
  if(meta){const done=ALL_ITEMS.filter(it=>itemComplete(it,ans(it.id))).length;
    meta.textContent=`${fmtDate(d.date)}／${d.inspector}　${done}/${ALL_ITEMS.length}項目${pdcaComplete(d)?"＋PDCA":""}`;}
  document.querySelectorAll(".cat-chip").forEach((c,i)=>{
    const mark=catDoneMark(i);
    c.innerHTML=`${i+1}. ${esc(CAT_NAMES[i])}${mark}`;
    c.classList.toggle("on",i===state.catIndex);
  });
}

/* ================= イベント ================= */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,label");
  if(!t) return;
  if(t.id==="to-home"){state.view="home";render();scrollTo(0,0);return;}
  if(t.dataset.cat!=null){state.catIndex=+t.dataset.cat;render();scrollTo(0,0);return;}
  if(t.dataset.nav){state.catIndex=Math.max(0,Math.min(REPORT_CAT,state.catIndex+ +t.dataset.nav));render();scrollTo(0,0);return;}
  if(t.dataset.eval){
    const [id,gk,...v]=t.dataset.eval.split(":");
    const a=ans(id); const val=v.join(":");
    a.evals[gk]=a.evals[gk]===val?"":val;
    persistDraft(); refreshCard(id); return;
  }
  if(t.dataset.delph){
    const [id,idx]=t.dataset.delph.split(":");
    if(!confirm("この写真を削除しますか？")) return;
    ans(id).photos.splice(+idx,1); persistDraft(); refreshCard(id); return;
  }
  if(t.id==="hw-add"){
    state.draft.pdca.homework.push({text:"",owner:"",due:"",priority:"中"});
    persistDraft(); render(); return;
  }
  if(t.dataset.hwpri){
    const [i,pr]=t.dataset.hwpri.split(":");
    state.draft.pdca.homework[+i].priority=pr; persistDraft(); render(); return;
  }
  if(t.dataset.hwdel!=null&&t.dataset.hwdel!==""){
    state.draft.pdca.homework.splice(+t.dataset.hwdel,1); persistDraft(); render(); return;
  }
  if(t.dataset.ai){judgeItem(t.dataset.ai);return;}
  if(t.dataset.aiapply){applyAISuggestion(t.dataset.aiapply);return;}
  if(t.dataset.jump){
    const [ci,id]=t.dataset.jump.split(":");
    state.catIndex=+ci; render();
    requestAnimationFrame(()=>document.getElementById("card-"+id)?.scrollIntoView({behavior:"smooth",block:"start"}));
    return;
  }
  if(t.id==="finalize"){
    const missing=collectMissing();
    if(missing.length){alert("未入力の項目があります。");render();return;}
    const insp=buildInspection(state.draft,false);
    await putInspection(insp); await kvDel("draft");
    state.inspections=state.inspections.filter(i=>i.id!==insp.id).concat(insp);
    state.draft=null; state.reportId=insp.id; state.view="report";
    render(); scrollTo(0,0); return;
  }
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset.photo!=null){
    const file=t.files&&t.files[0]; if(!file) return;
    try{
      const url=await compressPhoto(file);
      const id=t.dataset.photo;
      ans(id).photos.push(url);
      persistDraft(); refreshCard(id);
      if(AI_ENABLED&&state.fb&&state.fb.auto) judgeItem(id);
    }catch(err){alert("写真の読み込みに失敗しました。もう一度お試しください。");}
    return;
  }
  if(t.dataset.field){
    const [id,key]=t.dataset.field.split(":");
    ans(id).fields[key]=t.value; persistDraft();
    if(t.tagName==="SELECT") refreshCard(id); else refreshHeader();
    return;
  }
  if(t.dataset.pdcaDate){state.draft.pdca[t.dataset.pdcaDate]=t.value;persistDraft();return;}
  if(t.dataset.iv){(state.draft.pdca.interview||(state.draft.pdca.interview={}))[t.dataset.iv]=t.value;persistDraft();return;}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.field){const [id,key]=t.dataset.field.split(":");ans(id).fields[key]=t.value;persistDraft();refreshHeader();return;}
  if(t.dataset.iv){(state.draft.pdca.interview||(state.draft.pdca.interview={}))[t.dataset.iv]=t.value;persistDraft();return;}
  if(t.dataset.hw){const [i,k]=t.dataset.hw.split(":");state.draft.pdca.homework[+i][k]=t.value;persistDraft();refreshHeader();return;}
});

/* ================= 起動 ================= */
(async function init(){
  try{
    db=await openDB();
    state.inspections=(await allInspections())||[];
    const draft=await kvGet("draft");
    if(draft) state.draft=draft;
    state.fb=(await kvGet("fb"))||null;
    // 提供終了した旧モデル設定を自動で現行モデルへ移行
    if(state.fb&&/^gemini-2\.5/.test(state.fb.model||"")){
      state.fb.model=DEFAULT_AI_MODEL;
      kvSet("fb",state.fb).catch(()=>{});
    }
  }catch(e){ /* プライベートモード等でIndexedDBが使えない場合も画面は動く（保存なし） */ }
  render();
})();
</script>
</body>
</html>
