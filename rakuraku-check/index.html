<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#189B8B">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>らくらく臨店チェック</title>
</head>
<body>
<style>
:root{
  --bg:#F7F6F2; --card:#FFFFFF; --ink:#1E232B; --sub:#5C6470; --line:#E3E1DA;
  --accent:#0E8577; --accent-ink:#FFFFFF; --accent-soft:#DFF2EF;
  --good:#1E7F4C; --good-bg:#E3F2E9; --warn:#B26A00; --warn-bg:#FBF0DC; --bad:#BE3E36; --bad-bg:#F9E7E5;
  --shadow:0 1px 3px rgba(30,35,43,.08);
}
:root[data-theme="light"]{
  --bg:#F7F6F2; --card:#FFFFFF; --ink:#1E232B; --sub:#5C6470; --line:#E3E1DA;
  --accent:#0E8577; --accent-ink:#FFFFFF; --accent-soft:#DFF2EF;
  --good:#1E7F4C; --good-bg:#E3F2E9; --warn:#B26A00; --warn-bg:#FBF0DC; --bad:#BE3E36; --bad-bg:#F9E7E5;
  --shadow:0 1px 3px rgba(30,35,43,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",YuGothic,Meiryo,system-ui,sans-serif;
  color:var(--ink); line-height:1.6; -webkit-font-smoothing:antialiased;
}
#app{max-width:640px;margin:0 auto;padding-bottom:96px}
/* タブレットはスマホと同じ1カラム幅で表示する */
@media (min-width:700px) and (max-width:999px){
  #app{max-width:430px}
  .navbar .in{max-width:430px}
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{
  font:inherit;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;
}
textarea{min-height:72px;resize:vertical}
input[type=number]{font-variant-numeric:tabular-nums}
.field{margin-top:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.04em;margin-bottom:4px}
.field .unit{font-size:12px;color:var(--sub);margin-left:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hd{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:12px 16px 0;
}
.hd .bar{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.hd h1{font-size:16px;font-weight:700}
.hd .meta{font-size:12px;color:var(--sub)}
.item-alert{margin-top:10px;background:var(--bad-bg);color:var(--bad);font-size:12px;font-weight:700;border-radius:8px;padding:8px 10px}
.trend-bars{display:flex;gap:3px;align-items:flex-end;height:48px;margin-top:8px}
.tb{width:12px;border-radius:4px 4px 0 0;background:var(--line);min-height:4px}
.tb.lv5,.tb.lv4{background:var(--good)}
.tb.lv3{background:var(--warn)}
.tb.lv2,.tb.lv1{background:var(--bad)}
.month-row{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.mcell{text-align:center;min-width:48px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;flex:0 0 auto}
.mcell .mk{font-size:10px;color:var(--sub);white-space:nowrap}
.mcell .mv{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.mcell .mb{height:3px;border-radius:2px;margin-top:3px;background:var(--line)}
.mcell .mb.lv5,.mcell .mb.lv4{background:var(--good)}
.mcell .mb.lv3{background:var(--warn)}
.mcell .mb.lv2,.mcell .mb.lv1{background:var(--bad)}
.sync-bar{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  font-size:12px;color:var(--sub);background:var(--card);
  border-bottom:1px solid var(--line);padding:7px 16px;
}
.sync-bar b{color:var(--ink);font-variant-numeric:tabular-nums}
.sync-bar .sep{color:var(--line)}
.sync-bar .save-btn{margin-left:auto}
.net-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.net-dot.on{background:var(--good)}
.net-dot.off{background:var(--bad)}
.save-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.save-state{font-size:11px;color:var(--sub)}
.save-btn{font-size:12px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:4px 14px;background:var(--card);white-space:nowrap}
#toast{
  position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;
  font-size:13px;max-width:90vw;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;
}
#toast.show{opacity:1}
.progress{height:4px;background:var(--line);border-radius:2px;margin:10px 0 0;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.cats{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat-chip{
  flex:0 0 auto;font-size:12px;font-weight:600;padding:7px 12px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);color:var(--sub);white-space:nowrap;
}
.cat-chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cat-chip .st{margin-left:4px}
.wrap{padding:16px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);padding:16px;margin-bottom:14px;position:relative;overflow:hidden;
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.card.done::before{background:var(--good)}
.card h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge.done{background:var(--good-bg);color:var(--good)}
.badge.issue{background:var(--bad-bg);color:var(--bad)}
.badge.todo{background:var(--accent-soft);color:var(--accent)}
.desc{font-size:12px;color:var(--sub);margin-top:6px}
.desc li{margin-left:1.2em}
.note{font-size:11px;color:var(--sub);margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.sec-label{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.06em;margin:14px 0 6px}
/* 推移の一覧表示（一画面でまとめて見る） */
.back-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer;flex:0 0 auto}
.trow{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:1px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:none}
.trow.alert .tname{color:var(--bad);font-weight:700}
.tname{font-size:11.5px;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsc{display:flex;align-items:center;gap:3px;flex:0 0 auto}
.tsc.empty-sc{color:var(--sub);font-size:11px}
.tbars{display:inline-flex;align-items:flex-end;gap:1.5px;height:20px}
.tbars .b{width:6px;border-radius:1.5px 1.5px 0 0;background:var(--line);min-height:2px;opacity:.5}
.tbars .b.lv5,.tbars .b.lv4{background:var(--good)}
.tbars .b.lv3{background:#D9A21B}
.tbars .b.lv2,.tbars .b.lv1{background:var(--bad)}
.tbars .b.cur{opacity:1;width:8px}
.cur-num{font-size:12px;min-width:14px;text-align:center}
.cur-num.nlv5,.cur-num.nlv4{color:var(--good)}
.cur-num.nlv3{color:#8A6D1D}
.cur-num.nlv2,.cur-num.nlv1{color:var(--bad)}
.tcat{font-size:10.5px;font-weight:700;color:var(--sub);letter-spacing:.05em;margin:5px 0 1px}
.rank-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 6px}
.back-btn:disabled{opacity:.35;cursor:default}
/* 写真の拡大表示 */
.ph img{cursor:zoom-in}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(10,12,14,.88);display:flex;align-items:center;justify-content:center;padding:18px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.lightbox .lb-close{position:absolute;top:10px;right:12px;color:#fff;font-size:30px;line-height:1;padding:8px 12px;opacity:.9}
/* 更新バナー */
.upd-bar{position:fixed;left:0;right:0;top:0;z-index:80;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--accent);color:#fff;padding:11px 14px;font-size:13.5px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.upd-bar .upd-go{border:none;border-radius:8px;background:#fff;color:var(--accent);font-weight:800;font-size:13px;padding:7px 16px;cursor:pointer}
.upd-bar .upd-x{border:none;background:transparent;color:#fff;font-size:16px;padding:4px 8px;cursor:pointer;opacity:.85}
.tt{font-size:10px}
.tt{font-size:11px;color:var(--sub);margin-left:2px}
.tt.good{color:var(--good);font-weight:700}
.tt.bad{color:var(--bad);font-weight:700}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.photos .ph{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photos .ph .del{
  position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:20px;text-align:center;
}
.photo-add{
  width:72px;height:72px;border:1.5px dashed var(--accent);border-radius:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--accent);font-size:11px;font-weight:700;gap:2px;cursor:pointer;background:var(--accent-soft);
}
.photo-add span:first-child{font-size:20px;line-height:1}
.req{color:var(--bad);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{
  font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);
}
.chip.on-good{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.chip.on-warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.chip.on-bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.scale{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.scale button{
  text-align:left;width:100%;border:1.5px solid var(--line);border-radius:10px;
  padding:10px 12px;background:var(--card);font-size:13px;line-height:1.5;
}
.scale .sv{font-weight:800;font-variant-numeric:tabular-nums;margin-right:8px}
.scale .st{font-weight:700}
.scale .sd{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.scale button.on-good{background:var(--good-bg);border-color:var(--good)}
.scale button.on-good .sv,.scale button.on-good .st{color:var(--good)}
.scale button.on-warn{background:var(--warn-bg);border-color:var(--warn)}
.scale button.on-warn .sv,.scale button.on-warn .st{color:var(--warn)}
.scale button.on-bad{background:var(--bad-bg);border-color:var(--bad)}
.scale button.on-bad .sv,.scale button.on-bad .st{color:var(--bad)}
.btn{
  display:block;width:100%;text-align:center;font-weight:700;font-size:15px;
  padding:14px;border-radius:10px;background:var(--accent);color:var(--accent-ink);
}
.btn.sub{background:var(--card);color:var(--accent);border:1.5px solid var(--accent)}
.btn.ghost{background:none;color:var(--sub);border:1px solid var(--line);font-size:13px;padding:10px}
.btn:disabled{opacity:.45;cursor:default}
.navbar{
  position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--bg);
  border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
.navbar .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.navbar .btn{padding:12px}
.home-hero{padding:34px 16px 10px;text-align:left}
.hero-top{display:flex;align-items:center;gap:14px}
.hero-top svg{width:68px;height:68px;flex:0 0 auto}
.home-hero .eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--accent)}
.home-hero h1{font-size:26px;font-weight:800;letter-spacing:.02em;margin-top:4px;text-wrap:balance}
.home-hero p{font-size:13px;color:var(--sub);margin-top:6px;max-width:34em}
.hw-item{border-top:1px solid var(--line);padding:10px 0;font-size:13px}
.hw-item:first-of-type{border-top:none}
.hw-meta{font-size:11px;color:var(--sub);margin-top:2px}
.hw-row{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.list-card{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left}
.list-card .sc{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
.list-card .sc small{font-size:11px;color:var(--sub);font-weight:600}
.miss{border:1px solid var(--warn);background:var(--warn-bg);border-radius:10px;padding:12px;margin-bottom:14px}
.miss .ttl{font-weight:700;color:var(--warn);font-size:13px}
.miss button{display:block;width:100%;text-align:left;font-size:13px;padding:8px 0;border-top:1px solid var(--line)}
.miss button b{color:var(--warn)}
.score-ring{
  width:104px;height:104px;border-radius:50%;margin:0 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:6px solid var(--accent);background:var(--card);
}
.score-ring b{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.score-ring span{font-size:11px;color:var(--sub)}
.rep-h{ text-align:center;padding:8px 0 4px}
.rep-h h2{font-size:20px;font-weight:800}
.rep-h .meta{font-size:12px;color:var(--sub);margin:4px 0 14px}
.rep-item{border-top:1px solid var(--line);padding:12px 0}
.rep-item .nm{font-size:14px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rep-item .ev{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.rep-item .fx{font-size:12px;margin-top:6px;color:var(--sub)}
.rep-item .fx b{color:var(--ink)}
.rep-item .photos .ph{width:56px;height:56px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.kv .cell{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.kv .cell .k{font-size:11px;color:var(--sub)}
.kv .cell .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.txt-block{margin-top:10px}
.txt-block .k{font-size:12px;font-weight:700;color:var(--sub)}
.txt-block .v{font-size:13px;white-space:pre-wrap}
.empty{font-size:13px;color:var(--sub);padding:8px 0}
.del-row{font-size:11px;color:var(--bad);font-weight:700;margin-top:6px}
.ai-box{margin-top:14px;border:1px solid var(--accent);border-radius:10px;padding:12px;background:var(--accent-soft);font-size:13px}
.ai-box .ttl{font-size:12px;font-weight:700;color:var(--accent)}
.ai-box .rsn{font-size:12px;color:var(--sub);margin-top:4px}
.ai-box .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.ai-box .sug{margin-top:4px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
/* PC（1000px以上）専用のワイドレイアウト。スマホ・タブレットには影響しない */
@media (min-width:1000px){
  #app{max-width:1120px;padding-bottom:110px}
  .hd{padding:12px 28px 0}
  .hd .bar{max-width:1064px;margin:0 auto}
  .wrap{max-width:800px;margin:0 auto;padding:22px 16px}
  .navbar .in{max-width:800px}
  .card{padding:20px 22px}
  /* ホームはヒーローをカード風にし、下のカードを2カラムに並べる */
  .home-hero{max-width:1064px;margin:20px auto 0;border-radius:16px;border:1px solid var(--line);background:var(--card)}
  .home-hero+.wrap{max-width:1096px;columns:2;column-gap:18px}
  .home-hero+.wrap>*{break-inside:avoid;-webkit-column-break-inside:avoid}
  .home-hero+.wrap>#to-admin{column-span:all}
  .home-hero+.wrap>p{column-span:all}
  /* チェック画面：評価ボタンを読みやすく */
  .scale button{padding:12px 14px}
  /* 推移：グラフの棒を少し大きく */
  .tbars{height:24px}
  .tbars .b{width:8px}
  .tbars .b.cur{width:10px}
  .tname{font-size:12.5px}
  /* 写真サムネイルを大きめに（報告書内の小サムネイルは除く） */
  .photos .ph,.photo-add{width:120px;height:120px}
  .rep-item .photos .ph{width:64px;height:64px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
.print-only{display:none}
@media print{
  @page{ size:A4; margin:12mm; }
  body{background:#fff;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:10.5pt}
  .hd,.navbar,.no-print,.sync-bar,#toast{display:none !important}
  .print-only{display:block}
  #app{padding-bottom:0;max-width:none}
  .wrap{padding:0}
  .card{box-shadow:none;border:none;border-radius:0;padding:4mm 0;margin:0;break-inside:auto;background:#fff}
  .card::before{display:none}
  .card h3{font-size:12.5pt;border-left:1.2mm solid #189B8B;padding-left:3mm;margin-bottom:2mm}
  .rep-h{text-align:left;border-bottom:2px solid #189B8B;padding-bottom:4mm;margin-bottom:2mm}
  .rep-h h2{font-size:16pt;letter-spacing:.02em}
  .rep-h .meta{color:#444;font-size:10pt}
  .score-ring{width:30mm;height:30mm;border-width:1.6mm;border-color:#189B8B;margin:3mm 0 0}
  .score-ring b{font-size:16pt}
  .rep-item{break-inside:avoid;border-top:.3mm solid #bbb;padding:3mm 0}
  .rep-item .nm{font-size:11pt}
  .rep-item .photos{display:flex;flex-wrap:wrap;gap:3mm;margin-top:2mm}
  .rep-item .photos .ph{width:44mm;height:33mm;border:.3mm solid #ccc;border-radius:1.5mm}
  .rep-item .photos .ph img{width:100%;height:100%;object-fit:cover}
  .badge{border:.3mm solid currentColor;background:#fff !important}
  .badge.done{color:#1E7F4C}.badge.issue{color:#BE3E36}.badge.todo{color:#555}
  .txt-block .v{font-size:10pt}
  .hw-item{border-top:.3mm solid #ddd}
  .ai-box{border:.3mm solid #189B8B;background:#fff}
  a{color:inherit;text-decoration:none}
}
</style>
<div id="app" aria-live="polite"></div>
<script>
"use strict";
/* ================= データ定義 ================= */
const PRIORITIES = ["高","中","低"];
// 評価オプション: v=表示, s=点数, lv=色, issue=問題扱い(対応内容・期限・担当者を登録できる)
// s5(): 5段階評価グループを生成。defs=[ [短い要約, 詳しい基準文], ... ]（5点→1点の順）
function s5(defs){
  const meta=[["5点",100,"good",false],["4点",75,"good",false],["3点",50,"warn",true],["2点",25,"bad",true],["1点",0,"bad",true]];
  return {key:"main",label:"評価（5段階）",scale:true,
    options:meta.map(([v,s,lv,issue],i)=>({v,s,lv,issue,t:defs[i][0],desc:defs[i][1]||""}))};
}
const CHECK_CATS = [
  { id:"exterior", name:"店舗外観・入口", short:"外観・入口", items:[
    { id:"lighting", name:"照明・看板・提灯・周辺POP",
      desc:["店舗外観の電気・看板・提灯が正常に点灯しており、周辺POPに汚れや破損がないか"],

let db=null;
const state = { view:"home", catIndex:0, draft:null, inspections:[], reportId:null, fb:null };

function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open("rakuraku-check",2);
  r.onupgradeneeded=e=>{
    const d=e.target.result;
    if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
    if(!d.objectStoreNames.contains("inspections")) d.createObjectStore("inspections",{keyPath:"id"});
    if(!d.objectStoreNames.contains("outbox")) d.createObjectStore("outbox",{keyPath:"id"});
  };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});}
function tx(store,mode,fn){return new Promise((res,rej)=>{
  const t=db.transaction(store,mode),s=t.objectStore(store),q=fn(s);
  t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error);});}
const kvGet=k=>tx("kv","readonly",s=>s.get(k));
const kvSet=(k,v)=>tx("kv","readwrite",s=>s.put(v,k));
const kvDel=k=>tx("kv","readwrite",s=>s.delete(k));
const putInspection=i=>tx("inspections","readwrite",s=>s.put(i));
const delInspection=id=>tx("inspections","readwrite",s=>s.delete(id));
const getInspection=id=>tx("inspections","readonly",s=>s.get(id));
const allInspections=()=>tx("inspections","readonly",s=>s.getAll());
const outboxPut=o=>tx("outbox","readwrite",s=>s.put(o));
const outboxDel=id=>tx("outbox","readwrite",s=>s.delete(id));
const outboxAll=()=>tx("outbox","readonly",s=>s.getAll());
function uuid(){
  try{ return crypto.randomUUID(); }
  catch(e){ return "id-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10); }
}

let saveTimer=null;
function persistDraft(){
  if(!state.draft) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>kvSet("draft",state.draft).then(markSaved).catch(()=>{}),400);
}
function markSaved(){
  const el=document.getElementById("save-state");
  if(!el) return;
  const d=new Date();
  el.textContent=`自動保存済み ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function showToast(msg){
  let el=document.getElementById("toast");
  if(!el){el=document.createElement("div");el.id="toast";document.body.appendChild(el);}
  el.textContent=msg; el.classList.add("show");
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),2500);
}

function findItem(id){return ALL_ITEMS.find(i=>i.id===id);}
function ans(id){if(!state.draft.answers[id])state.draft.answers[id]={photos:[],evals:{},fields:{}};return state.draft.answers[id];}
function hasIssueEval(a,itemId){
  const item=findItem(itemId);
  return item.groups.some(g=>{const o=g.options.find(o=>o.v===a.evals[g.key]);return o&&o.issue;});
}
function shown(f,a){return f.show?f.show(a):true;}
function filled(v){return String(v??"").trim()!=="";}
function itemComplete(item,a){
  if(!item.photoOptional&&!item.noPhoto&&!a.photos.length) return false;
  if(item.evalOptional) return true; // 評価が任意の項目（テキーラタイムなど）は未選択でも完了扱い
  for(const g of item.groups){ if(!a.evals[g.key]) return false; }
  return true;
}
function itemScore(item,a){
  let sum=0;
  for(const g of item.groups){
    const o=g.options.find(o=>o.v===a.evals[g.key]);
    if(!o) return null; sum+=o.s;
  }
  return Math.round(sum/item.groups.length);
}
function totalScore(draft){
  // noScore の項目（テキーラタイムなど）は総合点に含めない
  const ss=ALL_ITEMS.filter(it=>!it.noScore).map(it=>itemScore(it,draft.answers[it.id]||{photos:[],evals:{},fields:{}})).filter(s=>s!=null);

function quotaHint(msg){

let _lastAI=0;
async function aiThrottle(){
  const GAP=4500;
  const now=Date.now(); const wait=Math.max(0,_lastAI+GAP-now);
  _lastAI=now+wait;
  if(wait) await new Promise(r=>setTimeout(r,wait));
}
// AI送信用に写真を縮小（トークン消費の節約。保存用の写真はそのまま）
function shrinkForAI(dataUrl){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=640; let w=img.naturalWidth,h=img.naturalHeight;
      const sc=Math.min(1,MAX/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      res(c.toDataURL("image/jpeg",0.6).split(",")[1]);
    };
    img.onerror=()=>res(dataUrl.split(",")[1]);
    img.src=dataUrl;
  });
}

async function judgeBatch(targets,silent){
  const d=state.draft; if(!d||batchBusy) return;
  aiGen++;
  for(const k of Object.keys(autoJudgeTimers)) clearTimeout(autoJudgeTimers[k]);
  batchBusy=true; batchErr=""; if(!silent) render();
  try{
    const parts=["あなたは飲食店の店舗巡回チェックの検査員です。以下の各チェック項目について、直後に添付された写真を確認して判定してください。"];
    for(const it of targets){
      const a=d.answers[it.id];
      const groups=it.groups.map(g=>`- ${g.key}（${g.label}）：${g.options.map(o=>o.v+(o.desc?`（${o.desc}）`:"")).join(" ／ ")}`).join("\n");
      parts.push(`\n【項目 ${it.id}】${it.name}\n確認内容：${it.desc.join("、")}\n選択肢：\n${groups}\nこの項目の写真：`);
      for(const p of a.photos.slice(0,2)){ parts.push({inlineData:{mimeType:"image/jpeg",data:await shrinkForAI(p)}}); }
    }
    parts.push(`\n\nすべての項目について、次のJSONのみを出力してください（コードブロックや説明文は不要。選択肢は文言そのまま）：\n{"items":{${targets.map(it=>`"${it.id}":{"judgments":{${it.groups.map(g=>`"${g.key}":"選択肢の文言"`).join(",")}},"reason":"判定理由を40字以内","confidence":"高か中か低"}`).join(",")}}}`);
    const out=parseAIJson(await aiGenerate(parts));
    if(!out||!out.items) throw new Error("AIの応答を解釈できませんでした。もう一度お試しください。");
    let n=0;
    for(const it of targets){
      const r=out.items[it.id];
      if(r&&r.judgments){ d.answers[it.id].ai={suggest:r.judgments,reason:String(r.reason||""),conf:String(r.confidence||""),at:todayStr()}; n++; }

async function judgeItem(itemId){

let ivBusy=false, ivErr="";
async function analyzeInterview(store,iv){
  const qs=INTERVIEW_QS.map(q=>({q,t:String(iv[q.key]||"").trim()}));
  const prompt=`あなたは飲食チェーンのスーパーバイザーを補佐するAIです。以下は店舗「${store}」の社員との面談記録です。
${qs.map(x=>`${x.q.label}
${x.t||"（未回答）"}`).join("\n")}

この面談内容を分析し、次のJSONのみを出力してください（コードブロックや説明文は不要）：
{"summary":"面談内容の要約（100字以内）","risk":0,"level":"高か中か低","concerns":["懸念点を最大4つ"],"reason":"リスク判定の理由（60字以内）"}
riskは0〜100の整数で、人間関係の悪化・人手不足・退職リスク・設備の故障放置・衛生問題・業務過多などが深刻なほど高くしてください。`;
  const out=parseAIJson(await aiGenerate(prompt));
  if(!out||out.summary==null) throw new Error("AIの応答を解釈できませんでした。もう一度お試しください。");
  return {
    summary:String(out.summary||""),
    risk:Math.max(0,Math.min(100,Math.round(+out.risk||0))),
    level:["高","中","低"].includes(out.level)?out.level:"中",
    concerns:Array.isArray(out.concerns)?out.concerns.slice(0,4).map(String):[],
    reason:String(out.reason||""),
    at:todayStr(),
  };
}

async function sha256hex(s){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
}

function bindLock(){
  const tryUnlock=async()=>{
    const code=$("#lock-code").value.trim();
    if(!code) return;
    try{
      const h=await sha256hex(code);
      if(h===ACCESS_CODE_HASH){
        await kvSet("access",h).catch(()=>{});
        state.locked=false; render(); return;
      }
    }catch(e){}
    const m=$("#lock-msg"); if(m){m.textContent="コードが違います。もう一度お試しください。";m.style.color="var(--bad)";}
  };

  $("#lock-code")?.focus();
}

function bindAdmin(){
  $("#gk-save")?.addEventListener("click",async()=>{
    const st=$("#gk-status"); const v=$("#gk-input").value.trim();
    if(!v){st.textContent="キーを貼り付けてください。";return;}
    deviceGeminiKey=v; aiModels={}; await kvSet("geminiKey",v).catch(()=>{});
    const shared=await cloudSaveGeminiKey(v);
    render();
    const s2=$("#gk-status");
    if(s2){s2.textContent=shared?"保存しました（全端末に自動共有されます）。「接続テスト」で確認できます。":"この端末に保存しました（クラウド未接続のため共有は保留）。";}
  });
  $("#gk-clear")?.addEventListener("click",async()=>{
    deviceGeminiKey=null; aiModels={}; await kvDel("geminiKey").catch(()=>{});
    await cloudDeleteGeminiKey();
    render();
  });
  $("#gk-test")?.addEventListener("click",async()=>{
    const st=$("#gk-status"); const v=$("#gk-input").value.trim();
    if(v&&v!==deviceGeminiKey){ deviceGeminiKey=v; aiModels={}; await kvSet("geminiKey",v).catch(()=>{}); }
    st.textContent="接続テスト中…（最大30秒）";
    try{
      const t=await withTimeout(aiGenerate("接続テストです。「OK」とだけ返してください。"),30000);
      st.textContent="接続成功："+String(t).trim().slice(0,40);
    }catch(err){ st.textContent="接続失敗："+friendlyAIError(err).slice(0,140); }
  });
  $("#fb-test-shared")?.addEventListener("click",async()=>{
    const st=$("#fb-shared-status");
    st.textContent="接続テスト中…（最大30秒）";
    try{
      const t=await withTimeout(aiGenerate("接続テストです。「OK」とだけ返してください。"),30000);
      st.textContent="接続成功："+String(t).trim().slice(0,40);
    }catch(err){
      st.textContent="接続失敗："+friendlyAIError(err).slice(0,120)+(lastAIError?`　詳細：${lastAIError.slice(0,160)}`:"");
    }
  });
  $("#gen-go")?.addEventListener("click",async()=>{
    const msg=$("#gen-msg"); const out=[];
    const fbText=$("#gen-fb").value.trim();
    if(fbText){
      const cfg=parseFirebaseConfig(fbText);
      if(!cfg){msg.textContent="firebaseConfigを読み取れませんでした。apiKeyを含む形で貼り付けてください。";return;}
      out.push(`const SHARED_FB_CONFIG=${JSON.stringify({config:cfg,model:DEFAULT_AI_MODEL,auto:true})};`);
    }
    const code=$("#gen-code").value.trim();
    if(code){
      try{ out.push(`const ACCESS_CODE_HASH="${await sha256hex(code)}";`); }
      catch(e){ msg.textContent="この環境ではハッシュを生成できませんでした（httpsで開いてください）。"; return; }
    }

    if(!out.length){msg.textContent="firebaseConfigか新しいアクセスコードのどちらかを入力してください。";return;}
    $("#gen-out").value=out.join("\n");
    $("#gen-out-wrap").hidden=false;
    msg.textContent="生成しました。GitHubでindex.htmlを開き、同じ名前で始まる行と置き換えてください（コミットすると自動で再公開されます）。";
  });
  $("#fb-save")?.addEventListener("click",async()=>{
    const status=$("#fb-status");
    const cfg=parseFirebaseConfig($("#fb-config").value);
    if(!cfg){status.textContent="設定を読み取れませんでした。apiKeyを含むfirebaseConfigを貼り付けてください。";return;}
    state.fb={config:cfg,model:($("#fb-model-custom").value.trim()||$("#fb-model").value),auto:!!$("#fb-auto").value};
    aiModels={};
    await kvSet("fb",state.fb).catch(()=>{});
    render();
    const st=$("#fb-status"); if(st) st.textContent="保存しました。「接続テスト」で動作確認できます。";
  });
  $("#fb-test")?.addEventListener("click",async()=>{
    const status=$("#fb-status");
    status.textContent="接続テスト中…";
    try{
      const cfg=parseFirebaseConfig($("#fb-config").value);
      if(cfg){
        state.fb={config:cfg,model:($("#fb-model-custom").value.trim()||$("#fb-model").value),auto:!!$("#fb-auto").value};
        aiModels={}; await kvSet("fb",state.fb).catch(()=>{});
      }
      const m=await getAIModel();
      const r=await m.generateContent("接続テストです。「OK」とだけ返してください。");
      status.textContent="接続成功："+r.response.text().trim().slice(0,40);
    }catch(err){
      status.textContent="接続失敗："+friendlyAIError(err);
    }
  });
}
function bindHome(){
  const storeIn=$("#f-store");
  const renderPrev=()=>{
    const box=$("#prev-hw"); if(!box) return;
    const last=lastInspectionFor(storeIn.value.trim());
    const hw=carriedHomework(last);
    box.innerHTML = last?`
      <div class="sec-label">前回（${fmtDate(last.date)}）の宿題・タスク</div>
      ${hw.length?hw.map(h=>`<div class="hw-item">${esc(h.text)}<div class="hw-meta">担当：${esc(h.owner||"—")}／期限：${fmtDate(h.due)}／優先度：${esc(h.priority||"—")}${h.auto?"／自動作成タスク":""}</div></div>`).join("")
        :`<p class="empty">前回の宿題はありません。</p>`}`:"";
  };
  storeIn?.addEventListener("input",renderPrev);
  $("#start")?.addEventListener("click",async()=>{
    const store=storeIn.value.trim(), inspector=$("#f-inspector").value.trim(), date=$("#f-date").value||todayStr();
    if(!store||!inspector){alert("店舗名と確認者を入力してください。");return;}
    if(state.draft && !confirm("進行中の下書きを破棄して新しく開始しますか？")) return;
    const last=lastInspectionFor(store);
    state.draft={
      id:uuid(), store, inspector, date,
      startedAt:new Date().toISOString(), answers:{},
      pdca:{ homework:[],interview:{} },
      prevDate:last?last.date:"",
    };
    persistDraft(); state.view="check"; state.catIndex=0; render(); scrollTo(0,0);
    const alerts=storeAlerts(store);
    if(alerts.length){ showToast(`⚠ 3点以下が${ALERT_COUNT}回以上の項目が${alerts.length}件あります`); beep(); }
  });
  $("#resume")?.addEventListener("click",()=>{state.view="check";render();scrollTo(0,0);});
  $("#discard")?.addEventListener("click",async()=>{
    if(!confirm("下書きを破棄しますか？入力内容と写真は失われます。"))return;
    state.draft=null; await kvDel("draft"); render();
  });
  document.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",async()=>{
    state.reportId=b.dataset.open; state.view="report"; render(); scrollTo(0,0);
    const insp=state.inspections.find(i=>i.id===state.reportId);
    if(insp&&await hydratePhotos(insp)&&state.view==="report") render();
  }));
  $("#search-store")?.addEventListener("input",e=>{
    const q=e.target.value.trim().toLowerCase();
    let hits=0, total=0;
    document.querySelectorAll("[data-sname]").forEach(el=>{
      const on=!q||el.dataset.sname.toLowerCase().includes(q);
      el.style.display=on?"":"none";
      total++; if(on) hits++;
    });
    const h=$("#search-hit");
    if(h) h.textContent=q?`「${e.target.value.trim()}」に一致：ランキング・推移・過去のチェックを絞り込み中（該当 ${hits}行）`:"";
  });
}

/* ---------- 項目別推移ビュー ---------- */
function viewTrends(){
  const store=state.trendStore;
  const hist=completedFor(store);
  const alerts=storeAlerts(store);
  const ivs=interviewsFor(store).slice(0,3);
  return `
  <header class="hd"><div class="bar" style="padding-bottom:10px;align-items:center">
    <button class="back-btn" id="to-home" aria-label="戻る">← 戻る</button>
    <h1 style="flex:1">${esc(store)}｜推移</h1><span class="meta">チェック${hist.length}回分</span>
  </div></header>
  <div class="wrap">
    ${alerts.length?`<div class="card" style="border-color:var(--bad)">
      <h3 style="color:var(--bad)">⚠ アラート（3点以下が${ALERT_COUNT}回以上）</h3>
      ${alerts.map(x=>`<div class="hw-item"><b>${esc(x.it.name)}</b><div class="hw-meta">3点以下が${x.c}回。重点的な改善が必要です。</div></div>`).join("")}
    </div>`:""}
    <div class="card" style="padding:12px 14px">
      <h3 style="margin-bottom:2px">全項目の推移（グラフ）</h3>
      <p class="desc" style="margin-bottom:2px;font-size:11px">直近${TREND_N}回分（左が古い・右端の濃い棒と数字が最新）</p>
      ${CHECK_CATS.map(cat=>{
        const rows=cat.items.filter(it=>itemVisibleFor(it,store)).map(it=>{
          const h=itemHistory(store,it);
          const lc=lowCount(store,it);
          if(!h.length) return `<div class="trow"><span class="tname">${esc(it.name)}</span><span class="tsc empty-sc">—</span></div>`;
          const last=h.slice(-TREND_N);
          const cur=last[last.length-1];
          const ma=monthlyAvg(h);
          const diff=ma.length<2?null:ma[ma.length-1].avg-ma[0].avg;
          const trend=diff==null?"":diff>0.2?`<span class="tt good">↗改善</span>`:diff<-0.2?`<span class="tt bad">↘悪化</span>`:`<span class="tt">→</span>`;
          return `<div class="trow${lc>=ALERT_COUNT?" alert":""}">
            <span class="tname">${lc>=ALERT_COUNT?"⚠ ":""}${esc(it.name)}</span>
            <span class="tsc"><span class="tbars">${last.map((p,i)=>`<span class="b lv${p.s5}${i===last.length-1?" cur":""}" style="height:${p.s5*20}%" title="${fmtDate(p.date)}：${p.s5}点"></span>`).join("")}</span><b class="cur-num nlv${cur.s5}">${cur.s5}</b>${trend}</span>
          </div>`;
        }).join("");
        return `<div class="tcat">${esc(cat.name)}</div>${rows}`;
      }).join("")}
    </div>
    <div class="card">
      <h3>面談内容（直近${ivs.length||0}回分）</h3>
      ${ivs.length?ivs.map(x=>`
        <div class="txt-block" style="margin-top:8px">
          <div class="k">面談 ${fmtDate(x.date)}${x.who?`／被面談者：${esc(x.who)}`:""}</div>
          ${x.qa.map(z=>`<div class="v" style="margin-top:4px"><b>${esc(z.label)}</b><br>${esc(z.text)}</div>`).join("")}
        </div>`).join(""):`<p class="empty">面談の記録がまだありません。</p>`}
    </div>
    <div class="card">
      <h3>ChatGPTで分析</h3>
      <p class="desc">分析用の指示文（プロンプト）つきでデータをコピーします。ChatGPTに貼り付けると、エリアマネージャーが実行すべき行動（PDCAのDo）だけを提案してくれます。</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn sub" id="gpt-store">この店舗の分析をコピー</button>
        <button class="btn ghost" id="gpt-copy">全店分析をコピー</button>
      </div>
      <p class="hw-meta" style="margin-top:8px">この店舗＝${esc(store)}の点数推移＋面談内容／全店＝全店舗のCSVデータ</p>
    </div>
    <button class="btn" id="to-home2">ホームへ戻る</button>
    <div style="margin-top:10px">
      <button class="btn ghost" id="store-del" style="color:var(--bad);border-color:var(--bad)">この店舗の記録をすべて削除（${hist.length}件）</button>
    </div>

const TREND_N=8; // 推移一覧に表示する直近のチェック回数

/* ---------- 共通保存（Cloud Firestore） ----------
   完了したチェックを全端末・全ユーザーで共有する。写真はドキュメント上限を
   避けるため photos コレクションに分けて保存。オフライン・未設定時は端末内
   （IndexedDB）のみで動作する。 */
let fsDb=null, fsMods=null, cloudReady=false, cloudErr="", cloudMigrated=false;
async function initCloud(){
  if(!SHARED_FB_CONFIG||!SHARED_FB_CONFIG.config) return;
  try{
    const V=FB_SDK_VERSION;
    const [appMod,fsMod,authMod]=await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
    ]);
    const app=appMod.getApps().length?appMod.getApp():appMod.initializeApp(SHARED_FB_CONFIG.config);
    try{ await authMod.signInAnonymously(authMod.getAuth(app)); }
    catch(e){ /* 匿名認証が無効でも、テストモードのルールなら動作する */ }
    setTimeout(()=>syncOutbox(),0); // ログイン直後の自動再送
    setTimeout(()=>cloudFetchGeminiKey(),0); // 共有AIキーの取得
    fsMods=fsMod;
    fsDb=fsMod.initializeFirestore(app,{localCache:fsMod.persistentLocalCache()});
    fsMod.onSnapshot(fsMod.collection(fsDb,"inspections"),async snap=>{
      const cloudIds=new Set(snap.docs.map(d=>d.id));
      const merged=snap.docs.map(d=>d.data());
      // 未送信（クラウドに未到達）の記録も一覧・ランキングに含める
      const local=(await allInspections().catch(()=>[]))||[];
      for(const l of local){ if(l&&l.id&&!cloudIds.has(l.id)) merged.push(l); }
      state.inspections=merged;
      cloudReady=true; cloudErr="";
      // タイムアウト後などに実はクラウドへ届いていた記録は「送信済み」に直す（未送信バッジが残る問題の解消）
      try{
        const cloudBy=new Map(snap.docs.map(d=>[d.id,d.data()]));
        const obs=(await outboxAll())||[]; let fixed=false;
        for(const o of obs){
          if(o.status==="synced"||o.status==="syncing") continue;
          const c=cloudBy.get(o.id); if(!c) continue;
          const li=local.find(l=>l&&l.id===o.id);
          if(li&&li.savedAt&&c.savedAt!==li.savedAt) continue; // 端末側に新しい版がある＝まだ未送信
          o.status="synced"; o.syncedAt=new Date().toISOString(); o.lastError="";
          await outboxPut(o); fixed=true;
        }
        if(fixed) await updateSyncBar();
      }catch(e){}
      if(!cloudMigrated){
        cloudMigrated=true;
        // この端末にだけ残っている過去の記録は送信キューに載せて自動送信
        for(const insp of local){
          if(insp&&insp.id&&!cloudIds.has(insp.id)&&!pendingIds.has(insp.id)){
            await outboxPut({id:insp.id,status:"pending",attempts:0,queuedAt:new Date().toISOString()}).catch(()=>{});
          }
        }
        syncOutbox();
      }
      if(["home","trends","report"].includes(state.view)) render();
    },err=>{
      cloudErr=String(err&&err.message||err); cloudReady=false;
      if(state.view==="home"||state.view==="admin") render();
    });
  }catch(e){ cloudErr=String(e&&e.message||e); }
}
function stripPhotos(insp){
  const slim=JSON.parse(JSON.stringify(insp));
  const photos=[];
  for(const [itemId,a] of Object.entries(slim.answers||{})){
    (a.photos||[]).forEach((data,idx)=>photos.push({id:`${insp.id}_${itemId}_${idx}`,inspId:insp.id,itemId,idx,data}));
    a.photoCount=(a.photos||[]).length;
    a.photos=[];
  }
  return {slim,photos};
}
async function cloudSave(insp,ob){
  if(!fsDb) throw new Error("クラウド未接続");
  const m=fsMods;
  const {slim,photos}=stripPhotos(insp);
  // 写真を先にすべて保存し、最後に記録本体を確定する（途中失敗しても同じIDで再送＝上書きされる）
  // 送信済みの写真は outbox に記録し、再送時はスキップ（写真が多い記録も再送のたびに前進する）
  const sent=new Set((ob&&ob.sentPhotos)||[]);
  for(const ph of photos){
    if(sent.has(ph.id)) continue;
    await withTimeout(m.setDoc(m.doc(fsDb,"photos",ph.id),{...ph,tenantId:insp.tenantId||SHARED_TENANT_ID}),25000,"写真の送信がタイムアウトしました");
    if(ob){ sent.add(ph.id); ob.sentPhotos=[...sent]; await outboxPut(ob).catch(()=>{}); }
  }
  slim.tenantId=insp.tenantId||SHARED_TENANT_ID;
  slim.storeId=insp.storeId||String(insp.store||"").trim();
  if(m.serverTimestamp) slim.receivedAt=m.serverTimestamp();
  await withTimeout(m.setDoc(m.doc(fsDb,"inspections",insp.id),slim),25000,"記録の送信がタイムアウトしました");
}
async function cloudDelete(id){
  if(!fsDb) return;
  const m=fsMods;
  await m.deleteDoc(m.doc(fsDb,"inspections",id)).catch(()=>{});
  try{
    const snap=await m.getDocs(m.query(m.collection(fsDb,"photos"),m.where("inspId","==",id)));
    for(const d of snap.docs){ await m.deleteDoc(d.ref).catch(()=>{}); }
  }catch(e){}
}
// 報告書表示時に、クラウド保存の写真を読み込んで結合する
async function hydratePhotos(insp){
  const need=Object.values(insp.answers||{}).some(a=>(a.photoCount||0)>0&&!(a.photos||[]).length);
  if(!need) return false;
  // まずこの端末のフルコピーから
  try{
    const local=await getInspection(insp.id);
    if(local&&Object.values(local.answers||{}).some(a=>(a.photos||[]).length)){
      for(const [k,a] of Object.entries(local.answers||{})){
        if(insp.answers[k]&&(a.photos||[]).length) insp.answers[k].photos=a.photos;
      }
      return true;
    }
  }catch(e){}
  if(!fsDb) return false;
  try{
    const m=fsMods;
    const snap=await m.getDocs(m.query(m.collection(fsDb,"photos"),m.where("inspId","==",insp.id)));
    snap.docs.forEach(d=>{
      const p=d.data(); const a=insp.answers&&insp.answers[p.itemId];
      if(a){ a.photos=a.photos||[]; a.photos[p.idx]=p.data; }
    });
    return snap.docs.length>0;
  }catch(e){ return false; }
}
/* ---------- 送信キュー（オフライン保存・自動再送） ----------
   完了した記録はまず端末内（outbox）に pending で保存し、通信可能なときに
   クラウドへ送信する。サーバー保存の確認が取れて初めて synced になる。
   状態: draft(下書き) → pending(送信待ち) → syncing(送信中) → synced / failed */
let syncRunning=false, syncNote="", pendingIds=new Set();
function withTimeout(p,ms,msg){
  return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg||"通信がタイムアウトしました")),ms))]);
}
async function refreshPendingIds(){
  try{
    const list=(await outboxAll())||[];
    pendingIds=new Set(list.filter(o=>o.status!=="synced").map(o=>o.id));
  }catch(e){ pendingIds=new Set(); }
}
async function updateSyncBar(note){
  if(note!==undefined) syncNote=note;
  await refreshPendingIds();
  const el=document.getElementById("sync-bar");
  if(el) el.outerHTML=syncBarHtml();
}
function syncBarHtml(){
  const online=navigator.onLine;
  const n=pendingIds.size;
  return `<div id="sync-bar" class="sync-bar">
    <span class="net-dot ${online?"on":"off"}" aria-hidden="true"></span><span>${online?"オンライン":"オフライン"}</span>
    <span class="sep">・</span><span>未送信 <b>${n}</b>件</span>
    ${syncRunning?`<span class="sep">・</span><span class="spin" aria-hidden="true"></span><span>送信中…</span>`:""}
    ${syncNote&&!syncRunning?`<span class="sep">・</span><span>${esc(syncNote)}</span>`:""}
    ${n>0&&!syncRunning?`<button class="save-btn" id="sync-now">今すぐ再送</button>`:""}
  </div>`;
}
async function syncOutbox(){
  if(syncRunning) return;
  const run=async()=>{
    if(syncRunning) return;
    syncRunning=true; await updateSyncBar();
    try{
      if(!fsDb){ await updateSyncBar("クラウド未接続のため端末に保存中"); return; }
      const list=((await outboxAll())||[]).filter(o=>o.status!=="synced");
      let ok=0,ng=0;
      for(const o of list){
        if(!navigator.onLine){ ng++; break; }
        o.status="syncing"; o.attempts=(o.attempts||0)+1; await outboxPut(o);
        try{
          const insp=await getInspection(o.id);
          if(!insp){ o.status="synced"; o.syncedAt=new Date().toISOString(); await outboxPut(o); continue; }
          await cloudSave(insp,o); // タイムアウトは写真1枚ごと（大きな記録も再送で前進する）
          o.status="synced"; o.syncedAt=new Date().toISOString(); o.lastError="";
          await outboxPut(o); ok++;
        }catch(err){
          o.status="failed"; o.lastError=String(err&&err.message||err).slice(0,200);
          await outboxPut(o); ng++;
        }
      }
      if(ok&&!ng){ showToast("送信完了：クラウドに保存されました"); await updateSyncBar("送信完了"); }
      else if(ng){ showToast("送信に失敗しました。通信回復後に自動で再送します"); await updateSyncBar("送信に失敗しました"); }
      else await updateSyncBar("");
    }finally{
      syncRunning=false; await updateSyncBar();
    }
  };
  // 排他制御：同時に複数の再送処理が走らないようにする
  if(navigator.locks&&navigator.locks.request){
    await navigator.locks.request("rakuraku-sync",{ifAvailable:true},async lock=>{ if(lock) await run(); });
  }else{
    await run();
  }
}

function buildInspection(d,preview,provisional){

function itemScoreOf(item,a){
  let sum=0;
  for(const g of item.groups){const o=g.options.find(o=>o.v===a.evals[g.key]);if(!o)return null;sum+=o.s;}
  return Math.round(sum/item.groups.length);
}

      if(state.fb&&/^gemini-2\.5/.test(state.fb.model||"")){

    if(ACCESS_CODE_HASH) state.locked=true;
  }
  render();

  // 通信復帰・画面再表示のたびに自動再送
  window.addEventListener("online",()=>{updateSyncBar("オンラインに戻りました");syncOutbox();});
  window.addEventListener("offline",()=>updateSyncBar("オフラインです（記録は端末に保存されます）"));
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ syncOutbox(); checkForUpdate(); } });
  syncOutbox(); // アプリ起動時の自動再送
  // 更新の見張り：60秒ごと＋画面再表示時に新バージョンを確認
  setInterval(checkForUpdate,60000);
  setTimeout(checkForUpdate,5000);
})();

/* ---------- 更新検知（UpdateNotifier） ----------
   サーバー上の index.html をキャッシュ無しで取得し、中の APP_VERSION と
   いま動いている版を比較する。新しければ「更新」バナーを出す（強制リロードはしない）。 */
var updateFound=false;
async function checkForUpdate(){
  if(updateFound||!navigator.onLine||location.protocol==="file:") return;
  try{
    const res=await fetch(location.pathname+"?uc="+Date.now(),{cache:"no-store"});
    if(!res.ok) return;
    const m=(await res.text()).match(/APP_VERSION="([^"]+)"/);
    if(m&&m[1]!==APP_VERSION){ updateFound=true; showUpdateBanner(m[1]); }
  }catch(e){}
}
/* 写真の拡大表示（タップで開く・どこをタップしても閉じる） */
function openLightbox(src){
  if(document.getElementById("lightbox")) return;
  const d=document.createElement("div");
  d.id="lightbox"; d.className="lightbox no-print";
  const img=document.createElement("img"); img.src=src; img.alt="拡大写真";
  const x=document.createElement("button"); x.className="lb-close"; x.textContent="×"; x.setAttribute("aria-label","閉じる");
  d.append(img,x);
  const close=()=>{d.remove();document.removeEventListener("keydown",onKey);};
  const onKey=ev=>{if(ev.key==="Escape")close();};
  d.addEventListener("click",close);
  document.addEventListener("keydown",onKey);
  document.body.appendChild(d);
}
function showUpdateBanner(v){
  if(document.getElementById("upd-bar")) return;
  const div=document.createElement("div");
  div.id="upd-bar"; div.className="upd-bar no-print";
  div.innerHTML=`<span>新しいバージョン（${esc(v)}）があります</span>
    <button class="upd-go" id="upd-go">更新</button>
    <button class="upd-x" id="upd-close" aria-label="閉じる">×</button>`;
  document.body.appendChild(div);
}
</script>
