<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v2.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180-v2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f4f0" />
    <meta name="description" content="店舗の毎日・毎週の衛生チェック写真を投稿し、本部がまとめて確認できる業務アプリ。" />
    <title>らくらく衛生管理</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 過去にデプロイされていた別アプリの Service Worker / Cache を完全に消去する
      (function () {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) {
              r.unregister();
            });
          });
        }
        if (typeof caches !== 'undefined' && caches.keys) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) {
              caches.delete(k);
            });
          });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
